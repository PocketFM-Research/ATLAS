: "e_ea03ec860845", "source": "ent_en04052c_1_ent_002", "relation": "uses", "target": "ent_en04052c_1_ent_011", "scene_refs": ["1"], "evidence": ["COMMANDER UHURA at the Comm Console", "I'm getting something on the distress channel."], "confidence": 0.95}, {"id": "e_a80e4251501f", "source": "ent_en04052c_1_ent_011", "relation": "part_of", "target": "ent_en04052c_1_ent_008", "scene_refs": ["1"], "evidence": ["COMMANDER UHURA at the Comm Console"], "confidence": 0.9}, {"id": "e_bd853d879dcf", "source": "ev_en04052c_1_ev_004", "relation": "causes", "target": "ev_en04052c_1_ev_005", "scene_refs": ["1"], "evidence": ["I'm getting something on the distress channel. Minimal signal...", "SAAVIK Can you amplify?"], "confidence": 0.92}, {"id": "e_4cb348e943a0", "source": "ev_en04052c_1_ev_003", "relation": "causes", "target": "ev_en04052c_1_ev_006", "scene_refs": ["1"], "evidence": ["SAAVIK Project parabolic course to avoid entering Neutral Zone.", "SULU Course change projected."], "confidence": 0.9}, {"id": "e_4e4858f8f38b", "source": "ent_en04052c_1_ent_010", "relation": "part_of", "target": "ent_en04052c_1_ent_011", "scene_refs": ["1"], "evidence": ["COMMANDER UHURA at the Comm Console", "I'm getting something on the distress channel."], "confidence": 0.75}, {"id": "e_739edb3d6fe7", "source": "ent_en04052c_1_ent_002", "relation": "undergoes", "target": "ev_en04052c_1_ev_005", "scene_refs": ["1"], "evidence": ["SAAVIK Can you amplify? UHURA I'm trying..."], "confidence": 0.88}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#556")
  .attr("stroke-width", 1.5);

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => d.type === "Event" ? 8 : 10)
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
