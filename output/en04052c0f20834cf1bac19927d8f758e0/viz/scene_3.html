<script>

th visible discomfort to birthday acknowledgment", "Spock reminds Kirk he took the Kobayashi Maru test three times"], "description": "Spock notes that the scenario is notoriously difficult and pointedly recalls that Kirk himself attempted the test three times, with a unique final solution.", "scene_refs": ["3"], "evidence": ["Kirk looks around uncomfortably, overlaps:", "SPOCK The Kobayashi Maru scenario frequently wreaks havoc with students and equipment. (dry) As I recall you took the test three times yourself. Your final solution was, shall we say, unique?", "KIRK Hrummm..."]}, {"id": "ev_en04052c_3_ev_005", "type": "Event", "name": "Kirk defends his unique Kobayashi Maru solution", "aliases": ["Spock reveals he is heading to the Enterprise for inspection", "Kirk defends his unique Kobayashi Maru solution"], "description": "Kirk solemnly justifies his unconventional approach to the no-win scenario by noting it had the virtue of never having been tried before.", "scene_refs": ["3"], "evidence": ["KIRK (solemn) It had the virtue of never having been tried.", "SPOCK The Enterprise. I must check in before your inspection."]}, {"id": "ev_en04052c_3_ev_006", "type": "Event", "name": "Spock notes Kirk's solution was non-Vulcan in nature", "aliases": ["Kirk curtly states he is going home", "Spock notes Kirk's solution was non-Vulcan in nature"], "description": "Spock observes that Kirk's solution to the Kobayashi Maru would not have occurred to a Vulcan mentality, underscoring the philosophical difference between them.", "scene_refs": ["3"], "evidence": ["KIRK (shortly) Home.", "SPOCK Yours was not a solution which would have occurred to a Vulcan mentality."]}, {"id": "ev_en04052c_3_ev_007", "type": "Event", "name": "Kirk critiques Saavik's emotional performance in the simulation", "aliases": ["Spock perceives and names Kirk's emotional oppression", "Kirk critiques Saavik's emotional performance in the simulation"], "description": "Spock observes Kirk's demeanor and directly states that something is oppressing him, demonstrating their deep friendship and Spock's perceptiveness.", "scene_refs": ["3"], "evidence": ["KIRK Speaking of which, your prot\u00e9g\u00e9's first rare -- a trifle emotional --", "SPOCK Something oppresses you.", "Spock studies him --"]}, {"id": "ev_en04052c_3_ev_008", "type": "Event", "name": "Spock explains Saavik's volatility as her half-Romulan heritage", "aliases": ["Kirk acknowledges his troubled state without elaborating", "Spock explains Saavik's volatility as her half-Romulan heritage"], "description": "Spock defends Saavik's emotional response by revealing she is half Romulan, explaining that the genetic admixture makes her more volatile than a full Vulcan.", "scene_refs": ["3"], "evidence": ["KIRK Something.", "SPOCK She's half Romulan, Jim. The admixture makes her more volatile than -- me, for example.", "They are old friends --"]}, {"id": "ev_en04052c_3_ev_009", "type": "Event", "name": "Kirk thanks Spock for a gift book", "aliases": ["Kirk departs alone into turbo elevator as Spock watches", "Kirk thanks Spock for a gift book"], "description": "Kirk steps into a turbo elevator and the doors close, physically separating the two friends and ending the scene with Spock left watching.", "scene_refs": ["3"], "evidence": ["He steps into a turbo elevator. The doors close as Spock watches, wiping the scene.", "He lifts the book.", "KIRK By the way, thank you for this."]}, {"id": "ent_en04052c_1_ent_001", "type": "Character", "name": "Saavik", "aliases": ["the Captain", "Captain Saavik", "Saavik", "Captain", "LT. SAAVIK", "your prot\u00e9g\u00e9"], "description": "The commanding officer on the Enterprise bridge during the Kobayashi Maru simulation, making critical tactical decisions under fire.", "scene_refs": ["3", "2", "1"], "evidence": ["LT. SAAVIK is young and beautiful. She is half Vulcan and half Romulan.", "SAAVIK Stand by transporter room", "SPOCK She's half Romulan, Jim. The admixture makes her more volatile than -- me", "The Captain is new -- and unexpected.", "SAAVIK Battle stations! Activate shields!", "SAAVIK In the neutral zone.", "SAAVIK Data on Kobayashi Maru!", "SAAVIK I'm aware of my responsibilities, Mister.", "SAAVIK Mr. Sulu, plot an intercept course.", "SAAVIK We're over our heads. Mr. Sulu, get us out of here.", "SAAVIK Project parabolic course to avoid entering Neutral Zone.", "SAAVIK On speakers!", "your prot\u00e9g\u00e9's first rare -- a trifle emotional --", "SAAVIK Damn.", "SAAVIK Activate escape pods. Send out the Log Buoy... All hands abandon ship.", "SAAVIK Can you amplify?"]}, {"id": "ent_en04052c_1_ent_005", "type": "Character", "name": "Spock", "aliases": ["subject vessel", "Spock", "third class neutronic fuel carrier", "Kobayashi Maru", "SPOCK"], "description": "A third-class neutronic fuel carrier that has struck a gravitic mine in the Neutral Zone and is sending a distress call.", "scene_refs": ["2", "3", "1"], "evidence": ["Spock almost smiles", "SPOCK I know of your fondness for antiques.", "Spock dies.", "SPOCK None of which I am consciously aware", "SPOCK The Kobayashi Maru scenario frequently wreaks havoc", "SPOCK The Enterprise. I must check in before your inspection.", "SPOCK Something oppresses you.", "SAAVIK Data on Kobayashi Maru!", "sees Spock, leaning against the wall", "SPOCK I am understandably curious", "as Spock watches", "SPOCK She's half Romulan, Jim", "SPOCK Yours was not a solution which would have occurred to a Vulcan mentality", "SPOCK No power to the weapons system, sir.", "Subject vessel is third class neutronic fuel carrier, crew of eighty-one, three hundred passengers.", "This is the Kobayashi Maru -- nineteen periods out of Altair Six", "DR. BONES McCOY and SPOCK at his post"]}, {"id": "ent_en04052c_3_ent_001", "type": "Character", "name": "Kirk", "aliases": ["KIRK", "Kirk"], "description": "A Starfleet admiral celebrating his birthday with visible discomfort who receives a book from Spock and departs alone.", "scene_refs": ["3"], "evidence": ["KIRK (dry) Aren't you dead?", "KIRK (solemn) It had the virtue of never having been tried", "Kirk rounds the corner and sees Spock", "KIRK They destroyed the simulator room and you with it", "KIRK (shortly) Home.", "KIRK So you said at the time", "He steps into a turbo elevator.", "KIRK Than you. Yes, I see that. By the way, thank you for this.", "Kirk looks around uncomfortably", "KIRK Something.", "KIRK Hrummm...", "KIRK (continuing) I assume you are loitering here", "KIRK (reads) 'It was the best of times...'"]}, {"id": "ent_en04052c_1_ent_009", "type": "Location", "name": "USS Enterprise", "aliases": ["Enterprise Bridge", "Parabolic Course", "USS Enterprise", "Starship Enterprise", "The Enterprise", "parabolic course"], "description": "The Starfleet starship whose bridge crew receives the distress call and must decide whether to enter the Neutral Zone.", "scene_refs": ["2", "3", "1"], "evidence": ["Project parabolic course to avoid entering Neutral Zone.", "Can you assist us, Enterprise?", "SPOCK The Enterprise. I must check in before your inspection.", "Enterprise approaches the stricken vessel", "Enterprise is hit", "We're dead in space", "Now entering the Neutral Zone...", "UHURA This is the Starship Enterprise.", "SULU Course change projected."]}, {"id": "ent_en04052c_3_ent_004", "type": "Location", "name": "Simulator Room", "aliases": ["'It was the best of times, it was the worst of times...'", "the simulator room", "A Tale of Two Cities", "Simulator Room", "simulator room"], "description": "The classic novel by Charles Dickens whose famous opening line Kirk reads aloud from the gifted book.", "scene_refs": ["3"], "evidence": ["They destroyed the simulator room and you with it", "The Kobayashi Maru scenario frequently wreaks havoc with students and equipment", "KIRK (reads) 'It was the best of times, it was the worst of times...'"]}, {"id": "ent_en04052c_3_ent_008", "type": "Location", "name": "Kirk's Home", "aliases": ["the book", "this", "Home", "Kirk's Home", "Book (gift from Spock)"], "description": "The destination Kirk tersely names when asked where he is headed, contrasting with Spock's purposeful errand.", "scene_refs": ["3"], "evidence": ["He lifts the book.", "By the way, thank you for this.", "KIRK (shortly) Home."]}, {"id": "ent_en04052c_3_ent_007", "type": "TimePoint", "name": "Kirk's Birthday", "aliases": ["half Romulan", "Romulan", "Kirk's Birthday", "happy birthday", "Romulan Heritage", "birthday"], "description": "Kirk's birthday, which serves as the occasion for Spock's gift and is a source of visible discomfort for Kirk.", "scene_refs": ["3"], "evidence": ["Kirk looks around uncomfortably", "She's half Romulan, Jim", "happy birthday -- surely the best of times", "The admixture makes her more volatile than -- me, for example"]}, {"id": "ent_en04052c_3_ent_003", "type": "Object", "name": "Antique Book", "aliases": ["Antique Book", "antiques", "antique"], "description": "An antique book gifted by Spock to Kirk for his birthday, containing the opening lines of A Tale of Two Cities.", "scene_refs": ["3"], "evidence": ["KIRK (reads) 'It was the best of times, it was the worst of times...'", "I know of your fondness for antiques"]}, {"id": "ent_en04052c_3_ent_006", "type": "Object", "name": "Turbo Elevator", "aliases": ["Vulcan Mentality", "Vulcan mentality", "a Vulcan mentality", "Turbo Elevator", "turbo elevator"], "description": "The logical, unemotional mode of thinking characteristic of Vulcans, which Spock contrasts with Kirk's unconventional solution.", "scene_refs": ["3"], "evidence": ["Yours was not a solution which would have occurred to a Vulcan mentality", "He steps into a turbo elevator. The doors close as Spock watches"]}, {"id": "ent_en04052c_3_ent_005", "type": "Concept", "name": "Kobayashi Maru", "aliases": ["Kobayashi Maru", "the test", "Kobayashi Maru scenario"], "description": "A notoriously difficult no-win training scenario that Kirk took three times and which Spock's cadets recently attempted.", "scene_refs": ["3"], "evidence": ["The Kobayashi Maru scenario frequently wreaks havoc with students and equipment", "Your final solution was, shall we say, unique?", "As I recall you took the test three times yourself"]}, {"id": "ent_en04052c_3_ent_009", "type": "Concept", "name": "Efficiency Rating", "aliases": ["efficiency rating", "Efficiency Rating", "Inspection", "inspection"], "description": "The performance rating Kirk intends to assign to Spock's cadets following the simulation, which motivates Spock's presence in the corridor.", "scene_refs": ["3"], "evidence": ["I must check in before your inspection", "I assume you are loitering here to learn what efficiency rating I plan to give your cadets", "SPOCK I am understandably curious"]}];
const links = [];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#556")
  .attr("stroke-width", 1.5);

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => d.type === "Event" ? 8 : 10)
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
