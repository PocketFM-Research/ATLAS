<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Star Trek II: The Wrath of Khan — Scene 4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
  .link { stroke-opacity: 0.5; }
  .link:hover { stroke-opacity: 1; }
  .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
  .node text { font-size: 11px; fill: #ccc; pointer-events: none; }
  .tooltip { position: absolute; background: rgba(20,20,40,0.95); border: 1px solid #555;
              border-radius: 6px; padding: 10px 14px; font-size: 13px; pointer-events: none;
              max-width: 360px; line-height: 1.4; display: none; z-index: 100; }
  .tooltip b { color: #fff; }
  .tooltip .type-badge { display: inline-block; padding: 1px 6px; border-radius: 3px;
                          font-size: 11px; margin-left: 6px; color: #fff; }
  #legend { position: fixed; top: 12px; right: 12px; background: rgba(20,20,40,0.9);
             border: 1px solid #444; border-radius: 8px; padding: 12px 16px; font-size: 13px; }
  #legend div { margin: 4px 0; }
  #legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
                  margin-right: 6px; vertical-align: middle; }
  #title-bar { position: fixed; top: 12px; left: 12px; font-size: 18px; font-weight: 600;
                background: rgba(20,20,40,0.9); border: 1px solid #444; border-radius: 8px;
                padding: 8px 16px; }
</style>
</head>
<body>
<div id="title-bar">Star Trek II: The Wrath of Khan — Scene 4</div>
<div id="legend"></div>
<div class="tooltip" id="tooltip"></div>
<svg></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const nodes = [{"id": "ev_en04052c_4_ev_reliant_observed", "type": "Event", "name": "USS Reliant is observed in deep space", "aliases": ["USS Reliant is observed in deep space"], "description": "The U.S.S. RELIANT, an older, somewhat battered starship of the ENTERPRISE class, is seen in the foreground.", "scene_refs": ["4"], "evidence": ["In f.g. is the U.S.S. RELIANT, an older, somewhat battered starship of the ENTERPRISE class, with a slightly different configuration."]}, {"id": "ev_en04052c_4_ev_reliant_approaches_ceti_alpha_v", "type": "Event", "name": "USS Reliant approaches Ceti Alpha V", "aliases": ["USS Reliant approaches Ceti Alpha V"], "description": "The USS Reliant approaches an inhospitable-looking yellow planet identified as CETI ALPHA V.", "scene_refs": ["4"], "evidence": ["Reliant approaches an inhospitable-looking yellow planet: CETI ALPHA V"]}, {"id": "ev_en04052c_4_ev_chekov_records_classified_log", "type": "Event", "name": "Commander Chekov records a classified starship log", "aliases": ["Commander Chekov records a classified starship log"], "description": "Commander Pavel Chekov, acting as Duty Officer, begins a starship log entry, classifying the report as 'MOST SECRET' on Stardate 8130.4.", "scene_refs": ["4"], "evidence": ["CHEKOV'S VOICE Starship log, Stardate 8130.4. This report classified MOST SECRET. Log Entry by Commander Pavel Chekov, Duty Officer."]}, {"id": "ev_en04052c_4_ev_reliant_orbital_approach_ceti_alpha_vi", "type": "Event", "name": "USS Reliant performs orbital approach for Project Genesis", "aliases": ["USS Reliant performs orbital approach for Project Genesis"], "description": "Chekov's log states the USS Reliant is on an orbital approach with Ceti Alpha VI in connection with the project code name GENESIS.", "scene_refs": ["4"], "evidence": ["Starship USS Reliant on orbital approach with Ceti Alpha VI in connection with project code name GENESIS."]}, {"id": "ev_en04052c_4_ev_searching_lifeless_planet_genesis", "type": "Event", "name": "USS Reliant continues search for Genesis test site", "aliases": ["USS Reliant continues search for Genesis test site"], "description": "Chekov's log indicates the Reliant crew is continuing their search for a lifeless planet to serve as a suitable test site for the Genesis Experiments.", "scene_refs": ["4"], "evidence": ["We are continuing our search for a lifeless planet which will serve as a suitable test site for the Genesis Experiments."]}, {"id": "ev_en04052c_4_ev_16_planets_no_success", "type": "Event", "name": "USS Reliant's search for a test site remains unsuccessful after 16 planets", "aliases": ["USS Reliant's search for a test site remains unsuccessful after 16 planets"], "description": "Chekov's log reveals that the current planet is the 16th they have visited, and they have not yet found a suitable test site for the Genesis Experiments.", "scene_refs": ["4"], "evidence": ["This is the 16th planet we have visited, so far, no success."]}, {"id": "ent_en04052c_4_ent_pavel_chekov", "type": "Character", "name": "Pavel Chekov", "aliases": ["Pavel Chekov", "CHEKOV'S VOICE", "Commander Pavel Chekov"], "description": "The Duty Officer on the USS Reliant who records a classified starship log entry.", "scene_refs": ["4"], "evidence": ["CHEKOV'S VOICE", "Commander Pavel Chekov"]}, {"id": "ent_en04052c_4_ent_ceti_alpha_v", "type": "Location", "name": "Ceti Alpha VI", "aliases": ["CETI ALPHA V", "Ceti Alpha V", "Ceti Alpha VI"], "description": "A planet with which the USS Reliant is on orbital approach in connection with Project Genesis.", "scene_refs": ["4"], "evidence": ["Ceti Alpha VI", "CETI ALPHA V"]}, {"id": "ent_en04052c_4_ent_stardate_8130_4", "type": "TimePoint", "name": "Stardate 8130.4", "aliases": ["Stardate 8130.4"], "description": "The specific stardate on which Commander Chekov records a classified starship log.", "scene_refs": ["4"], "evidence": ["Stardate 8130.4"]}, {"id": "ent_en04052c_4_ent_uss_reliant", "type": "Object", "name": "USS Reliant", "aliases": ["U.S.S. RELIANT", "Reliant", "USS Reliant"], "description": "An older, somewhat battered starship of the Enterprise class, observed in deep space and approaching Ceti Alpha V and Ceti Alpha VI.", "scene_refs": ["4"], "evidence": ["U.S.S. RELIANT", "Starship USS Reliant", "Reliant approaches"]}, {"id": "ent_en04052c_4_ent_enterprise_class", "type": "Concept", "name": "Enterprise class", "aliases": ["ENTERPRISE class", "Enterprise class"], "description": "The classification of starship to which the USS Reliant belongs.", "scene_refs": ["4"], "evidence": ["starship of the ENTERPRISE class"]}, {"id": "ent_en04052c_4_ent_most_secret", "type": "Concept", "name": "MOST SECRET", "aliases": ["MOST SECRET"], "description": "The classification level assigned to Commander Chekov's starship log report.", "scene_refs": ["4"], "evidence": ["This report classified MOST SECRET"]}, {"id": "ent_en04052c_4_ent_project_genesis", "type": "Concept", "name": "Project Genesis", "aliases": ["project code name GENESIS", "GENESIS", "Genesis Experiments", "Project Genesis"], "description": "A project for which the USS Reliant is searching for a suitable lifeless planet test site.", "scene_refs": ["4"], "evidence": ["project code name GENESIS", "Genesis Experiments"]}];
const links = [];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#556")
  .attr("stroke-width", 1.5);

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => d.type === "Event" ? 8 : 10)
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
</body>
</html>
