<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Star Trek II: The Wrath of Khan — Scene 5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
  .link { stroke-opacity: 0.5; }
  .link:hover { stroke-opacity: 1; }
  .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
  .node text { font-size: 11px; fill: #ccc; pointer-events: none; }
  .tooltip { position: absolute; background: rgba(20,20,40,0.95); border: 1px solid #555;
              border-radius: 6px; padding: 10px 14px; font-size: 13px; pointer-events: none;
              max-width: 360px; line-height: 1.4; display: none; z-index: 100; }
  .tooltip b { color: #fff; }
  .tooltip .type-badge { display: inline-block; padding: 1px 6px; border-radius: 3px;
                          font-size: 11px; margin-left: 6px; color: #fff; }
  #legend { position: fixed; top: 12px; right: 12px; background: rgba(20,20,40,0.9);
             border: 1px solid #444; border-radius: 8px; padding: 12px 16px; font-size: 13px; }
  #legend div { margin: 4px 0; }
  #legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
                  margin-right: 6px; vertical-align: middle; }
  #title-bar { position: fixed; top: 12px; left: 12px; font-size: 18px; font-weight: 600;
                background: rgba(20,20,40,0.9); border: 1px solid #444; border-radius: 8px;
                padding: 8px 16px; }
</style>
</head>
<body>
<div id="title-bar">Star Trek II: The Wrath of Khan — Scene 5</div>
<div id="legend"></div>
<div class="tooltip" id="tooltip"></div>
<svg></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const nodes = [{"id": "ev_en04052c_5_ev_001", "type": "Event", "name": "Terrell orders standard orbit", "aliases": ["Terrell moves to Chekov's station", "Terrell orders standard orbit"], "description": "Terrell rises from his position and crosses the bridge to Chekov's station.", "scene_refs": ["5"], "evidence": ["Terrell rises and crosses to Chekov.", "TERRELL Standard orbit, Mr. Beach."]}, {"id": "ev_en04052c_5_ev_002", "type": "Event", "name": "Beach confirms standard orbit", "aliases": ["Beach confirms standard orbit", "Chekov detects minor energy flux"], "description": "Chekov informs Terrell that they have detected a minor energy flux reading on one of their dyno scanners, originating from Ceti Alpha.", "scene_refs": ["5"], "evidence": ["We've picked up a minor energy flux reading on one dyno scanner.", "BEACH Standard orbit, sir."]}, {"id": "ev_en04052c_5_ev_003", "type": "Event", "name": "Terrell inquires about surface scan changes", "aliases": ["Terrell questions the energy flux reading", "Terrell inquires about surface scan changes"], "description": "Terrell expresses surprise and doubt about the energy flux reading, questioning its validity and suggesting a scanner malfunction.", "scene_refs": ["5"], "evidence": ["Damn! Are you sure? Maybe the scanner's out of adjustment --", "TERRELL Any change in surface scan?"]}, {"id": "ev_en04052c_5_ev_004", "type": "Event", "name": "Beach reports Ceti Alpha's lifeless conditions", "aliases": ["Chekov speculates on flux origin", "Beach reports Ceti Alpha's lifeless conditions"], "description": "Mr. Beach reports that the surface scan shows no changes, detailing Ceti Alpha's harsh environment incapable of supporting life forms.", "scene_refs": ["5"], "evidence": ["BEACH Negative. Limited atmosphere, dominated by craylon gas, sand and high velocity winds. Incapable of supporting life forms.", "I suppose it could be a particle of preanimate matter caught in the matrix..."]}, {"id": "ev_en04052c_5_ev_005", "type": "Event", "name": "Ceti Alpha displayed on forward screen", "aliases": ["Terrell decides to contact Doctor Marcus", "Ceti Alpha displayed on forward screen"], "description": "Terrell decides to contact Doctor Marcus via Comm-pic for analysis of the energy flux, hoping it might be something they can transplant.", "scene_refs": ["5"], "evidence": ["Forward screen: Ceti Alpha .", "All right, let's get on the Comm-pic to Doctor Marcus. Maybe it's something we can transplant."]}, {"id": "ev_en04052c_5_ev_006", "type": "Event", "name": "Chekov questions Ceti Alpha's lifelessness", "aliases": ["Chekov anticipates Doctor Marcus's reaction", "Chekov questions Ceti Alpha's lifelessness"], "description": "Commander Chekov asks if Ceti Alpha must be completely lifeless, hinting at his past experience or knowledge.", "scene_refs": ["5"], "evidence": ["You know what she'll say...", "CHEKOV Does it have to be completely lifeless?"]}, {"id": "ent_en04052c_5_ent_001", "type": "Character", "name": "Terrell", "aliases": ["Terrell", "CAPTAIN CLARK TERRELL"], "description": "The Captain of the Reliant, described as well-aged, soft spoken, and somewhat laconic.", "scene_refs": ["5"], "evidence": ["Terrell", "CAPTAIN CLARK TERRELL"]}, {"id": "ent_en04052c_5_ent_002", "type": "Character", "name": "Chekov", "aliases": ["COMMANDER CHEKOV", "Chekov"], "description": "A Commander on the Reliant, aged but still boyish, who questions the lifelessness of Ceti Alpha.", "scene_refs": ["5"], "evidence": ["COMMANDER CHEKOV", "CHEKOV"]}, {"id": "ent_en04052c_5_ent_003", "type": "Character", "name": "Beach", "aliases": ["Mr. Beach", "Beach"], "description": "An officer on the Reliant who confirms Captain Terrell's orders and reports on the surface scan of Ceti Alpha.", "scene_refs": ["5"], "evidence": ["Mr. Beach", "BEACH"]}, {"id": "ent_en04052c_5_ent_005", "type": "Location", "name": "Ceti Alpha", "aliases": ["Ceti Alpha"], "description": "A planet with a limited atmosphere, dominated by craylon gas, sand, and high velocity winds, incapable of supporting life forms.", "scene_refs": ["5"], "evidence": ["Ceti Alpha"]}, {"id": "ent_en04052c_5_ent_006", "type": "Object", "name": "Forward screen", "aliases": ["Forward screen"], "description": "A display screen on the bridge of the Reliant, used to show data related to Ceti Alpha.", "scene_refs": ["5"], "evidence": ["Forward screen"]}, {"id": "ent_en04052c_5_ent_004", "type": "Concept", "name": "Standard orbit", "aliases": ["Standard orbit"], "description": "A specific orbital maneuver ordered by Captain Terrell for the Reliant.", "scene_refs": ["5"], "evidence": ["Standard orbit"]}];
const links = [{"id": "e_8568f1f9ce91", "source": "ent_en04052c_5_ent_001", "relation": "performs", "target": "ev_en04052c_5_ev_001", "scene_refs": ["5"], "evidence": ["Terrell rises and crosses to Chekov.", "TERRELL Standard orbit, Mr. Beach."], "confidence": 0.95}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#556")
  .attr("stroke-width", 1.5);

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => d.type === "Event" ? 8 : 10)
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
</body>
</html>
