rd the restaurant, passing the COSMOPOLITAN CAFE"]}, {"id": "ev_en627701_12_doc_11_chunk_1_ev_002", "type": "Event", "name": "Bouncer confronts Dicky", "aliases": ["Bouncer confronts Dicky"], "description": "A bouncer at the Cosmopolitan Cafe confronts Dicky, accusing him of drug use.", "scene_refs": ["12"], "evidence": ["BOUNCER (puts his hand up, shakes HIS HEAD) Whoa, spucky teeth, I thought you were smokin' rocks, now you're gargling with 'em? DICKY (looks away, mumbles) You're 'bout to lose your breath. BOUNCER I'm about to lose my what?"]}, {"id": "ev_en627701_12_doc_11_chunk_1_ev_003", "type": "Event", "name": "Dicky assaults bouncer", "aliases": ["Dicky assaults bouncer"], "description": "Dicky punches the bouncer in the gut and jaw, knocking him to the sidewalk.", "scene_refs": ["12"], "evidence": ["And Dicky nails the bouncer in the gut, drops him to his knees, wind knocked out of him, then Dicky hooks his jaw... 6'4\" guy dropping fast, hitting the sidewalk, sickening thud."]}, {"id": "ev_en627701_12_doc_11_chunk_1_ev_004", "type": "Event", "name": "Dicky punches chasing cop", "aliases": ["Dicky punches chasing cop"], "description": "Dicky punches a police officer who is chasing him, breaking the officer's nose.", "scene_refs": ["12"], "evidence": ["COP CHASING HIM on foot runs up, Dicky PUNCHES HIM OUT. Busting open his nose, blood pouring."]}, {"id": "ev_en627701_12_doc_11_chunk_1_ev_005", "type": "Event", "name": "Dicky swings at second cop", "aliases": ["Dicky swings at second cop"], "description": "Dicky takes a swing at another police officer during the escalating confrontation.", "scene_refs": ["12"], "evidence": ["Dicky takes a swing at ANOTHER COP."]}, {"id": "ev_en627701_12_doc_11_chunk_1_ev_006", "type": "Event", "name": "Police arrest Dicky", "aliases": ["Police arrest Dicky"], "description": "Multiple police officers arrive, slam Dicky to the ground, and arrest him as he screams and fights back.", "scene_refs": ["12"], "evidence": ["More poli ding a newspaper in his police uniform.", "scene_refs": ["13"], "evidence": ["Micky's eyes wide, catches sight of Mickey O'Keefe in the back drinking coffee, reading the newspaper, still in his police uniform."]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_006", "type": "Event", "name": "Micky greets Mickey O'Keefe", "aliases": ["Micky greets Mickey O'Keefe"], "description": "Micky calls out 'Hey!' to Mickey O'Keefe.", "scene_refs": ["13"], "evidence": ["MICKY Hey!"]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_007", "type": "Event", "name": "Mickey O'Keefe hugs Micky", "aliases": ["Mickey O'Keefe hugs Micky"], "description": "Mickey O'Keefe stands up and hugs Micky in greeting.", "scene_refs": ["13"], "evidence": ["MICKEY O'KEEFE (stands, hugs Micky hello) How's ya hand?!"]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_008", "type": "Event", "name": "Mickey O'Keefe comments on Micky's hand", "aliases": ["Mickey O'Keefe comments on Micky's hand"], "description": "Mickey O'Keefe observes that Micky's hand looks better.", "scene_refs": ["13"], "evidence": ["MICKEY O'KEEFE (CONT'D) Looks bettah."]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_009", "type": "Event", "name": "Micky confirms his hand is healing", "aliases": ["Micky confirms his hand is healing"], "description": "Micky confirms that his hand is good and getting there.", "scene_refs": ["13"], "evidence": ["MICKY It's good, gettin' there."]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_010", "type": "Event", "name": "Mickey O'Keefe invites Micky to gym and criticizes his weight", "aliases": ["Mickey O'Keefe invites Micky to gym and criticizes his weight"], "description": "Mickey O'Keefe invites Micky to the gym and calls him a 'fat fuck,' commenting on his out-of-shape appearance.", "scene_refs": ["13"], "evidence": ["MICKEY O'KEEFE Why don't ya come down to the gym if ya want? Ya fat fuck, look atcha."]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_011", "type": "Event", "name": "Micky expresses worry about HBO movie and public judgment", "aliases": ["Micky expresses worry about HBO movie and public judgment"], "description": "Micky expresses concern about the HBO movie airing tonight and how people are looking at him as if he did something wrong.", "scene_refs": ["13"], "evidence": ["MICKY (looks at people staring) Now I gotta worry about this movie tonight on HBO, everybody lookin' at me like I did somethin' wrong, ain't my fault he's on TV."]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_012", "type": "Event", "name": "Mickey O'Keefe advises Micky not to watch the movie", "aliases": ["Mickey O'Keefe advises Micky not to watch the movie"], "description": "Mickey O'Keefe advises Micky that it's better for him not to watch the movie because it will make him feel bad.", "scene_refs": ["13"], "evidence": ["MICKEY O'KEEFE It's bettah for ya if ya don't see it, Micky, it's just gonna make ya feel bad."]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_013", "type": "Event", "name": "Mickey O'Keefe defends Micky to the crowd", "aliases": ["Mickey O'Keefe defends Micky to the crowd"], "description": "Mickey O'Keefe turns to the staring people and defends Micky, clarifying that Micky won't be on TV, but his 'crazy brothah' will.", "scene_refs": ["13"], "evidence": ["[turns to everyone] What are you lookin' at? He ain't gonna be on TV, it's his crazy brothah."]}, {"id": "ev_en627701_13_doc_12_chunk_0_ev_014", "type": "Event", "name": "People continue to stare", "aliases": ["People continue to stare"], "description": "Despite Mickey O'Keefe's defense, people continue to stare at Micky and Mickey O'Keefe.", "scene_refs": ["13"], "evidence": ["People stare at them."]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_001", "type": "Event", "name": "Dicky visits with son and Alice", "aliases": ["Dicky visits with son and Alice"], "description": "Dicky is playing with his 4-year-old son while sitting across from Alice in the crowded, smoke-filled visitor's room of the Billerica House of Corrections.", "scene_refs": ["13"], "evidence": ["BILLERICA HOUSE OF CORRECTIONS - VISITOR'S ROOM-1ST FLOOR - DAY .Dicky playing with his 4-year-old son, sitting across from Alice smoking a Lucky, three newspapers in her lap, room crowded with convicts, visitors, thick with smoke."]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_002", "type": "Event", "name": "Alice informs Dicky about movie talk", "aliases": ["Alice informs Dicky about movie talk"], "description": "Alice tells Dicky that everyone is talking about 'the movie'.", "scene_refs": ["13"], "evidence": ["ALICE Everybody's talkin' about the movie, Dicky, it sounds."]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_003", "type": "Event", "name": "Dicky reveals inmates will watch the movie", "aliases": ["Dicky reveals inmates will watch the movie"], "description": "Dicky, regretful and wary, acknowledges the talk about the movie and reveals that inmates on the first two tiers will watch it tonight.", "scene_refs": ["13"], "evidence": ["DICKY (regretful, wary) I know. (shakes his head) They're lettin' everybody on the first two tiers watch it tonight."]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_004", "type": "Event", "name": "Dicky plays 'knuckle sandwich' with son", "aliases": ["Dicky plays 'knuckle sandwich' with son"], "description": "Dicky encourages his son to hit him with a 'knuckle sandwich,' leading to him popping out his fake teeth and both laughing.", "scene_refs": ["13"], "evidence": ["C'mon, hit daddy with a kunckle sandwich. Bang-bang. Right in the mouth. (takes Little Dicky's hand, hits own mouth) C'mon, a knuckle sandwich! .Little Dicky hits Dicky in the mouth again. . .And Dicky pops out his fake teeth. Little Dicky cracks up laughing. (CENTTNTTF.T)) The Fighter 8/28/09 GREEN DRAFT 61aA. CONTINUED: DICKY (CONT'D) (laughing with his son) - My teef, my teef, Dicky, you knocked out my teef!"]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_005", "type": "Event", "name": "Alice expresses concern about movie's portrayal", "aliases": ["Alice expresses concern about movie's portrayal"], "description": "Alice tells Dicky that people are saying the movie makes him and the city look bad, asking what they made him do.", "scene_refs": ["13"], "evidence": ["ALICE They're sayin' it makes you an' the city look bad. What'd they make ya do?"]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_006", "type": "Event", "name": "Dicky justifies the movie's purpose", "aliases": ["Dicky justifies the movie's purpose"], "description": "Dicky expresses regret that the movie didn't work out as intended and suggests they say it was made for kids, specifically about drugs.", "scene_refs": ["13"], "evidence": ["DICKY (pops his teeth back) It wasn't supposed to work out this way. Say we did it for the kids, ma. ALICE What kids, Dicky? DICKY About drugs, and all that."]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_007", "type": "Event", "name": "Dicky expresses desire to work with Micky again", "aliases": ["Dicky expresses desire to work with Micky again"], "description": "Dicky asks if Micky will watch the movie, questions why Micky doesn't visit, and expresses his strong desire for a second chance to work with Micky to win a title.", "scene_refs": ["13"], "evidence": ["Is Micky gonna watch it? You ask 'im why he don't come to see me? All I do in here is think about comin' back and workin' with Micky, that's what keeps me goin'. I want a second chance to do it right for him and win a title. Will ya tell him that for me?"]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_008", "type": "Event", "name": "Guard interrupts visit", "aliases": ["Guard interrupts visit"], "description": "A guard informs Dicky that he has five minutes left and needs to wrap up his visit.", "scene_refs": ["13"], "evidence": ["They hear a guard, \"C'mon, five minutes Dicky, wrap it up.\""]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_009", "type": "Event", "name": "Little Dicky cups his father's nose", "aliases": ["Little Dicky cups his father's nose"], "description": "Little Dicky gently cups his father's nose as the visit is about to end.", "scene_refs": ["13"], "evidence": ["Little Dicky reaches out and gently cups his father's nose.."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_001", "type": "Event", "name": "Dicky enters the Trap room", "aliases": ["Dicky enters the Trap room"], "description": "Dicky steps into 'the Trap,' a processing room for inmates, where a Corrections Officer is present.", "scene_refs": ["14"], "evidence": ["He steps into the Trap, the room in which inmates arrive to be processed, where a guard, Corrections Officer 2, 30s, tall, sits."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_002", "type": "Event", "name": "Corrections Officer questions Dicky", "aliases": ["Corrections Officer questions Dicky"], "description": "The Corrections Officer, surprised, recognizes Dicky and questions his presence in the Trap.", "scene_refs": ["14"], "evidence": ["CORRECTIONS OFFICER (stands, surprised) Dicky!? What're you doin' here?"]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_003", "type": "Event", "name": "Dicky expresses desire to go home and comfort", "aliases": ["Dicky expresses desire to go home and comfort"], "description": "Dicky states he needs to go home to tell 'Dicky' that 'he don't gotta cry,' revealing his confused mental state.", "scene_refs": ["14"], "evidence": ["DICKY I gotta go home, Harry. I gotta tell Dicky it's gonna be okay, he don't gotta cry."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_004", "type": "Event", "name": "Corrections Officer redirects and warns Dicky", "aliases": ["Corrections Officer redirects and warns Dicky"], "description": "The Corrections Officer physically guides Dicky and warns him to return upstairs to avoid being written up.", "scene_refs": ["14"], "evidence": ["CORRECTIONS OFFICER (steps out, puts a hand on DICKY'S SHOULDER) Get back upstairs before I write ya up."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_005", "type": "Event", "name": "Dicky reiterates his delusion", "aliases": ["Dicky reiterates his delusion"], "description": "Dicky repeats his belief that 'He don't gotta cry no more,' reinforcing his detachment from reality.", "scene_refs": ["14"], "evidence": ["DICKY - He don't gotta cry no more."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_006", "type": "Event", "name": "Corrections Officer dismisses Dicky and orders him back", "aliases": ["Corrections Officer dismisses Dicky and orders him back"], "description": "The Corrections Officer states he doesn't understand Dicky's words and firmly orders him to return upstairs.", "scene_refs": ["14"], "evidence": ["CORRECTIONS OFFICER I don't know what you're talking about, Dicky, but you can't be here. You gotta go back up."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_007", "type": "Event", "name": "Dicky complies and leaves the Trap", "aliases": ["Dicky complies and leaves the Trap"], "description": "Dicky looks at the officer, turns, and heads back, complying with the order.", "scene_refs": ["14"], "evidence": ["Dicky looks at Corrections Officer 2, turns and heads back."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_008", "type": "Event", "name": "Dicky walks through corridor to kitchen", "aliases": ["Dicky walks through corridor to kitchen"], "description": "Dicky walks down a dimly lit corridor on the second floor and enters a dark kitchen.", "scene_refs": ["14"], "evidence": ["CORRIDOR, 2ND FLOOR - B.H.C. - NIGHT. Dicky walking down the dimly lit hall, shadows dancing off walls, distant cheering, screaming echoing... stepping into the dark kitchen..."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_009", "type": "Event", "name": "Dicky kneels and prays", "aliases": ["Dicky kneels and prays"], "description": "Dicky sinks to his knees on the cement floor in the kitchen and bows his head to pray.", "scene_refs": ["14"], "evidence": ["Dicky sinks to his knees onto the hard grey cement floor and bows his head to pray."]}, {"id": "ev_en627701_14_doc_13_chunk_1_ev_001", "type": "Event", "n const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#556")
  .attr("stroke-width", 1.5);

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => d.type === "Event" ? 8 : 10)
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
