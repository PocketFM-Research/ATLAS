 "dicky expresses hope for a second chance", "aliases": ["dicky expresses hope for a second chance"], "description": "Dicky says he keeps going by thinking about returning to work with Micky, winning a title, and doing things right.", "scene_refs": ["13"], "evidence": ["All I do in here is think about comin' back and workin' with Micky, that's what keeps me goin'.", "I want a second chance to do it right for him and win a title."]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_009", "type": "Event", "name": "dicky asks alice to relay his message", "aliases": ["dicky asks alice to relay his message"], "description": "Dicky asks Alice to tell Micky that he wants another chance and wants to work with him again.", "scene_refs": ["13"], "evidence": ["Will ya tell him that for me?"]}, {"id": "ev_en627701_13_doc_12_chunk_1_ev_010", "type": "Event", "name": "guard ends the visit", "aliases": ["guard ends the visit"], "description": "A guard interrupts and tells Dicky that his five minutes are up.", "scene_refs": ["13"], "evidence": ["They hear a guard, \"C'mon, five minutes Dicky, wrap it up.\""]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_001", "type": "Event", "name": "Dicky enters the processing room", "aliases": ["Dicky enters the processing room"], "description": "Dicky steps into the Trap, the inmate processing room, where a guard is stationed.", "scene_refs": ["14"], "evidence": ["He steps into the Trap, the room in which inmates arrive to be processed, where a guard, Corrections Officer 2, 30s, tall, sits."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_002", "type": "Event", "name": "Corrections officer recognizes Dicky", "aliases": ["Corrections officer recognizes Dicky"], "description": "The corrections officer is surprised to see Dicky and addresses him by name.", "scene_refs": ["14"], "evidence": ["CORRECTIONS OFFICER (stands, surprised) Dicky!? What're you doin' here?"]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_003", "type": "Event", "name": "Dicky insists on going home", "aliases": ["Dicky insists on going home"], "description": "Dicky says he needs to go home because he has to reassure someone that everything will be okay.", "scene_refs": ["14"], "evidence": ["DICKY I gotta go home, Harry. I gotta tell Dicky it's gonna be okay, he don't gotta cry."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_004", "type": "Event", "name": "Officer orders Dicky back upstairs", "aliases": ["Officer orders Dicky back upstairs"], "description": "The officer warns Dicky not to stay there and tells him to return upstairs before he gets written up.", "scene_refs": ["14"], "evidence": ["CORRECTIONS OFFICER (steps out, puts a hand on DICKY'S SHOULDER) Get back upstairs before I write ya up."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_005", "type": "Event", "name": "Dicky repeats his concern", "aliases": ["Dicky repeats his concern"], "description": "Dicky repeats that the person he is worried about no longer has to cry.", "scene_refs": ["14"], "evidence": ["DICKY - He don't gotta cry no more."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_006", "type": "Event", "name": "Officer sends Dicky back", "aliases": ["Officer sends Dicky back"], "description": "The officer says he does not understand Dicky but insists he cannot remain there and must go back up.", "scene_refs": ["14"], "evidence": ["CORRECTIONS OFFICER I don't know what you're talking about, Dicky, but you can't be here. You gotta go back up."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_007", "type": "Event", "name": "Dicky returns to the corridor", "aliases": ["Dicky returns to the corridor"], "description": "Dicky turns away from the officer and heads back upstairs.", "scene_refs": ["14"], "evidence": ["Dicky looks at Corrections Officer 2, turns and heads back."]}, {"id": "ev_en627701_14_doc_13_chunk_0_ev_008", "type": "Event", "name": "Dicky walks through the corridor", "aliases": ["Dicky walks through the corridor"], "description": "Dicky moves down the hallway toward the kitchen area, with ext morning. Micky's hands grab dingy white boxing wraps out of the darkness of his messy closet, faded red gloves, throws them into an old blue gym bag, leaves."]}, {"id": "ev_en627701_14_doc_13_chunk_1_ev_009", "type": "Event", "name": "Charlene wakes alone in Micky's bed", "aliases": ["Charlene wakes alone in Micky's bed"], "description": "Charlene wakes up in Micky's shirt after he has already left and gets out of bed.", "scene_refs": ["14"], "evidence": ["Charlene sits up in bed, groggy, gets up in Micky's t-shirt, goes out."]}, {"id": "ev_en627701_14_doc_13_chunk_1_ev_010", "type": "Event", "name": "Micky stands at stairs with gym bag", "aliases": ["Micky stands at stairs with gym bag"], "description": "Micky pauses at the top of the stairs with his gym bag, looking out into the morning.", "scene_refs": ["14"], "evidence": ["Micky stands at the top of the stairs, old blue gym bag slung over his shoulder, early morning. He looks out at morning..."]}, {"id": "ev_en627701_15_doc_14_chunk_0_ev_001", "type": "Event", "name": "Charlene runs outside", "aliases": ["Charlene runs outside"], "description": "Charlene rushes out of the apartment as Micky pauses on the stairs.", "scene_refs": ["15"], "evidence": ["Micky pauses on stairs.", "Charlene runs out;"]}, {"id": "ev_en627701_15_doc_14_chunk_0_ev_002", "type": "Event", "name": "Micky asks to meet cab company man", "aliases": ["Micky asks to meet cab company man"], "description": "Micky says he wants to meet the man George told Charlene about, the one who owns a cab company.", "scene_refs": ["15"], "evidence": ["The one with the cab company.", "MICKY (pauses on stairs) I wanna meet that guy George told you about."]}, {"id": "ev_en627701_15_doc_14_chunk_0_ev_003", "type": "Event", "name": "Charlene agrees silently", "aliases": ["Charlene agrees silently"], "description": "Charlene nods in response to Micky's request.", "scene_refs": ["15"], "evidence": ["Charlene nods,"]}, {"id": "ev_en627701_15_doc_14_chunk_0_ev_004" , "scene_refs": ["16"], "evidence": ["SAL LONANO (NODS) I already made some calls. Spoke to Bobby Tags and he says we can get a small fight, somethin' local to staht back with."]}, {"id": "ev_en627701_16_doc_15_chunk_0_ev_009", "type": "Event", "name": "Mickey O'Keefe frames the fight as confidence-building", "aliases": ["Mickey O'Keefe frames the fight as confidence-building"], "description": "Mickey O'Keefe and Sal agree that the local fight is meant to help Micky regain confidence and build from there.", "scene_refs": ["16"], "evidence": ["SAL LONANO Right, go from there.", "MICKEY O'KEEFE Get ya confidence back."]}, {"id": "ev_en627701_16_doc_15_chunk_0_ev_010", "type": "Event", "name": "Mickey O'Keefe sets conditions for training Micky", "aliases": ["Mickey O'Keefe sets conditions for training Micky"], "description": "Mickey O'Keefe agrees to train Micky only if Dicky and Alice stay away, making their absence a condition of his involvement.", "scene_refs": ["16"], "evidence": ["MICKEY O'KEEFE No Dicky, no Alice. If they come back, I'm gone, Mick. I can't deal with the bullshit, no offense Georgie.", "MICKEY O'KEEFE - Micky, I know ya dad wants this guy to manage ya, and I'll train ya on one condition."]}, {"id": "ev_en627701_16_doc_15_chunk_0_ev_011", "type": "Event", "name": "George jokes about being punished", "aliases": ["George jokes about being punished"], "description": "George responds with dark humor, saying he is the one who will get his balls cut off, underscoring the family tension.", "scene_refs": ["16"], "evidence": ["GEORGE None taken, I'm the one who's gonna get his balls cut off anyway."]}, {"id": "ev_en627701_16_doc_15_chunk_1_ev_001", "type": "Event", "name": "Alice attacks George with kitchenware", "aliases": ["Alice attacks George with kitchenware"], "description": "Alice hurls pots and plates at George in a furious confrontation.", "scene_refs": ["16"], "evidence": ["George holds his arms up as pots, plates come flying at him.", "Alice looking around for something else to throw at him."]}, {"id": "ev_en627701_16_doc_15_chunk_1_ev_002", "type": "Event", "name": "George restrains Alice", "aliases": ["George restrains Alice"], "description": "George grabs Alice and holds her back before she can strike him again.", "scene_refs": ["16"], "evidence": ["George grabs her and holds on before she can hit him..."]}, {"id": "ev_en627701_16_doc_15_chunk_1_ev_003", "type": "Event", "name": "Alice accuses George of betrayal", "aliases": ["Alice accuses George of betrayal"], "description": "Alice angrily calls George a traitor for helping Micky.", "scene_refs": ["16"], "evidence": ["ALICE You traitor motherfucker!", "GEORGE Those pans hurt, you crazy bitch! I hadda help Micky!"]}, {"id": "ev_en627701_16_doc_15_chunk_1_ev_004", "type": "Event", "name": "Alice objects to LoNano involvement", "aliases": ["Alice objects to LoNano involvement"], "description": "Alice protests that George helped Micky through LoNano and declares she must now step in to save Micky herself.", "scene_refs": ["16"], "evidence": ["ALICE With that scumbag LoNano?! Now I gotta save Micky!"]}, {"id": "ev_en627701_16_doc_15_chunk_1_ev_005", "type": "Event", "name": "Alice and sisters head to Micky's car", "aliases": ["Alice and sisters head to Micky's car"], "description": "Alice and most of her sisters pile into Alice's Lincoln Continental to go after Micky.", "scene_refs": ["16"], "evidence": ["Alice and most of the sisters piling into Alice's car."]}, {"id": "ev_en627701_16_doc_15_chunk_1_ev_006", "type": "Event", "name": "Micky and Charlene are interrupted", "aliases": ["Micky and Charlene are interrupted"], "description": "Micky and Charlene are making out in their underwear when Alice and the sisters arrive outside.", "scene_refs": ["16"], "evidence": ["Micky and Charlene make out in their underwear on the bed when a car screeches up outside.", "Charlene looks out her window, sees TWO SISTERS on her porch while Alice and FOUR OTHER SISTERS pi // Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#8fa4ff")
  .attr("stroke-width", d => {
    const rel = String(d.relation || "").toLowerCase();
    if (rel === "performs" || rel === "undergoes" || rel === "experiences") return 2.8;
    if (rel === "occurs_at" || rel === "located_at" || rel === "present_on") return 2.2;
    return 1.8;
  });

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => Math.max(7, Math.min(16, 6 + Math.sqrt((degreeById[d.id] || 0) + 1) * 3)))
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  h += `<br><i>Degree:</i> ${degreeById[d.id] || 0}`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
</body>
</html>
