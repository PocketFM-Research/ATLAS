7701_12_doc_11_chunk_1_ev_004", "scene_refs": ["12"], "evidence": ["More police cars pull up. Officers jump out and slam Dicky to the ground! Dicky screams, fighting back, kicking and punching the police arresting him..."], "confidence": 0.95}, {"id": "e_dacb3747d4a0", "source": "ev_en627701_12_doc_11_chunk_1_ev_004", "relation": "occurs_at", "target": "ent_en627701_12_doc_11_chunk_1_ent_004", "scene_refs": ["12"], "evidence": ["STREET - COSMOPOLITAN CAFE/OLYMPIA RESTAURANT - DOWNTOWN, LOWELL - NIGHT.", "More police cars pull up. Officers jump out and slam Dicky to the ground!"], "confidence": 0.96}, {"id": "e_c6d1c47df6ba", "source": "ent_en627701_2_doc_1_chunk_0_ent_015", "relation": "performs", "target": "ev_en627701_12_doc_11_chunk_1_ev_001", "scene_refs": ["12"], "evidence": ["MICKEY O'KEEFE We were lookin' at tape today on Belinc and I think if Micky cuts down the ring in most rounds --"], "confidence": 0.55}, {"id": "e_7ce0694343a3", "source": "ent_en627701_2_doc_1_chunk_0_ent_008", "relation": "performs", "target": "ev_en627701_12_doc_11_chunk_1_ev_001", "scene_refs": ["12"], "evidence": ["ALICE (STANDS UP) Ohmygahd! Dicky!", "Alice still holding Micky's lobby card, heads outside with George, Sherry, sisters."], "confidence": 0.72}, {"id": "e_bcd957508e9c", "source": "ent_en627701_3_doc_2_chunk_1_ent_002", "relation": "performs", "target": "ev_en627701_12_doc_11_chunk_1_ev_001", "scene_refs": ["12"], "evidence": ["Alice still holding Micky's lobby card, heads outside with George, Sherry, sisters."], "confidence": 0.7}, {"id": "e_481ac2c7e00b", "source": "ent_en627701_2_doc_1_chunk_0_ent_009", "relation": "performs", "target": "ev_en627701_12_doc_11_chunk_1_ev_001", "scene_refs": ["12"], "evidence": ["Alice still holding Micky's lobby card, heads outside with George, Sherry, sisters."], "confidence": 0.7}, {"id": "e_5f4f8dc0b4bc", "source": "ent_en627701_2_doc_1_chunk_0_ent_013", "relation": "performs", "target": "ev_en627701_12_doc_11_chunk_1_ev_001", "scene_refs": ["12"], "evidence": ["Alice still holding Micky's lobby card, heads outside with George, Sherry, sisters."], "confidence": 0.7}, {"id": "e_0e532b546373", "source": "ent_en627701_2_doc_1_chunk_0_ent_015", "relation": "performs", "target": "ev_en627701_12_doc_11_chunk_1_ev_002", "scene_refs": ["12"], "evidence": ["MICKEY O'KEEFE We were lookin' at tape today on Belinc and I think if Micky cuts down the ring in most rounds --"], "confidence": 0.5}, {"id": "e_b26dcfcaef16", "source": "ent_en627701_3_doc_2_chunk_0_ent_010", "relation": "performs", "target": "ev_en627701_12_doc_11_chunk_1_ev_003", "scene_refs": ["12"], "evidence": ["Dicky runs toward the restaurant, passing the COSMOPOLITAN CAFE, crowd of people out front, BOUNCER..."], "confidence": 0.4}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

// Degree lookup from the rendered link set.
const degreeById = Object.fromEntries(nodes.map(n => [n.id, 0]));
for (const link of links) {
  if (degreeById[link.source] != null) degreeById[link.source] += 1;
  if (degreeById[link.target] != null) degreeById[link.target] += 1;
}

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#8fa4ff")
  .attr("stroke-width", d => {
    const rel = String(d.relation || "").toLowerCase();
    if (rel === "performs" || rel === "undergoes" || rel === "experiences") return 2.8;
    if (rel === "occurs_at" || rel === "located_at" || rel === "present_on") return 2.2;
    return 1.8;
  });

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => Math.max(7, Math.min(16, 6 + Math.sqrt((degreeById[d.id] || 0) + 1) * 3)))
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  h += `<br><i>Degree:</i> ${degreeById[d.id] || 0}`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
