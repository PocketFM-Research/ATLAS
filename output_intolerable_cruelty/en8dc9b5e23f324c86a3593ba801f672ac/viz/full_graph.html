s hand and asks a question about 'Extinguish?' in response to Miles's speech.", "scene_refs": ["24"], "evidence": ["Wrigley raises his hand. WRIGLEY Extinguish?"]}, {"id": "ev_en8dc9b5_24_doc_23_chunk_1_ev_003", "type": "Event", "name": "miles contrasts fear and trust", "aliases": ["miles contrasts fear and trust"], "description": "Miles challenges the associates to choose trust over fear and building over destruction in client relationships.", "scene_refs": ["24"], "evidence": ["MILES Should we counsel fear -- or trust? Should we seek to destroy -- or to build? Should we meet our clients' problems with cynicism -- or with love?"]}, {"id": "ev_en8dc9b5_24_doc_23_chunk_1_ev_004", "type": "Event", "name": "kramer answers build", "aliases": ["kramer answers build"], "description": "Miles calls on Kramer, who answers that the choice is to build.", "scene_refs": ["24"], "evidence": ["MILES (another raised hand) Kramer? KRAMER Build?"]}, {"id": "ev_en8dc9b5_24_doc_23_chunk_1_ev_005", "type": "Event", "name": "miles declares leap of love", "aliases": ["miles declares leap of love"], "description": "Miles says the decision is each person's, and he declares that he has made the leap of love with no return.", "scene_refs": ["24"], "evidence": ["MILES The decision of course, is each of ours. For my part, I have made the leap of love, and there is no going back"]}, {"id": "ev_en8dc9b5_24_doc_23_chunk_1_ev_006", "type": "Event", "name": "herb watches silently", "aliases": ["herb watches silently"], "description": "Herb Myserson sits in the back of the room, silently observing Miles's speech while breathing heavily.", "scene_refs": ["24"], "evidence": ["Herb Myserson sits in the back of the room. He watches, breathing heavily."]}, {"id": "ev_en8dc9b5_25_doc_24_chunk_0_ev_001", "type": "Event", "name": "cuddle on sofa", "aliases": ["cuddle on sofa"], "description": "Miles and Marylin sit closely together on a small sofa while watching a cable movie.", "scene_refs": ["25"], "eviden  sits on new sofa"], "description": "Marylin walks into the den and sits on the new sofa, acting as if she has a right to be there.", "scene_refs": ["38"], "evidence": ["Marylin walks into the den. Sits on the new sofa.", "MARYLIN Comfy!"]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_0_part_0_ev_006", "type": "Event", "name": "Marylin threatens Miles", "aliases": ["Marylin threatens Miles"], "description": "When Miles asks what she wants, Marylin bluntly says she wants to ruin him.", "scene_refs": ["38"], "evidence": ["MARYLIN I want to nail you ass.", "MILES What do you want?"]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_0_part_1_ev_001", "type": "Event", "name": "Miles claims the items are gifts", "aliases": ["Miles claims the items are gifts"], "description": "Miles insists that the expensive items he received from clients are merely gifts.", "scene_refs": ["38"], "evidence": ["MILES Those are gifts.", "Stuff you get from grateful clients."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_0_part_1_ev_002", "type": "Event", "name": "Marilyn labels the gifts unreported income", "aliases": ["Marilyn labels the gifts unreported income"], "description": "Marilyn rejects Miles's explanation and frames the items as taxable, undeclared income.", "scene_refs": ["38"], "evidence": ["MARYLIN Salary. Unreported income."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_0_part_1_ev_003", "type": "Event", "name": "Marilyn checks the time on Bellagio Road", "aliases": ["Marilyn checks the time on Bellagio Road"], "description": "Marilyn glances at her watch and asks what time it is on Bellagio Road, implying concern about another location or schedule.", "scene_refs": ["38"], "evidence": ["(Glancing at his watch) By the way, what time IS it on Bellagio Road?"]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_0_part_1_ev_004", "type": "Event", "name": "Miles denies wrongdoing", "aliases": ["Miles denies wrongdoing"], "description": "Miles responds defensively that Marilyn cannot prove any illegal conduct.", "scene_refs": ["38"], "evidence": ["MILES You can't prove anything."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_0_part_1_ev_005", "type": "Event", "name": "Marilyn invokes IRS enforcement", "aliases": ["Marilyn invokes IRS enforcement"], "description": "Marilyn says she does not need proof herself because IRS agents handle such cases aggressively.", "scene_refs": ["38"], "evidence": ["MARYLIN I don't have to. That's what the IRS guys do. And they do it with great zeal."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_0_part_1_ev_006", "type": "Event", "name": "Marilyn explains IRS resentment", "aliases": ["Marilyn explains IRS resentment"], "description": "Marilyn describes IRS workers as bitter and vengeful toward wealthy lawyers who treat their work as a source of luxury perks.", "scene_refs": ["38"], "evidence": ["See, they work at these tortuous civil service jobs, and when five hundred dollar an hour boys like you take their trade out in luxury goodies, these saps feel.. well, they feel like saps. And they feel bitter and they feel vengeful and they feel WRATH."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_0_part_1_ev_007", "type": "Event", "name": "Marilyn smokes Miles's cigar", "aliases": ["Marilyn smokes Miles's cigar"], "description": "Marilyn puffs on Miles's cigar while mocking it as a Romeo y Julieta.", "scene_refs": ["38"], "evidence": ["(Puffing on the cigar) What is this? A Romeo and Julieta?"]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_001", "type": "Event", "name": "Miles insults Marilyn's competence", "aliases": ["Miles insults Marilyn's competence"], "description": "Miles tells Marilyn she is out of her league and asserts that he is the professional.", "scene_refs": ["38"], "evidence": ["MILES You're out of your league, Marylin. Rexroth was a primate. I'm a professional."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_002", "type": "Event", "name": "Marylin reveals IRS pressure", "aliases": ["Marylin reveals IRS pressure"], "description": "Marylin says she is also a professional and warns Miles that IRS Agent Wilson is involved and tenacious.", "scene_refs": ["38"], "evidence": ["MARYLIN I know. So am I, right? And so is Agent Wilson of the Internal Revenue Service. He's a dedicated, underpaid graduate of Southwestern University -- very tenacious, and never more so than when he's dealing with an unscrupulous colleague."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_003", "type": "Event", "name": "Marylin threatens legal action", "aliases": ["Marylin threatens legal action"], "description": "Marylin stands to leave and warns Miles that she will file an action and later seek an injunction barring him from her house.", "scene_refs": ["38"], "evidence": ["(She stands to leave) I think it's only fair to warn you: I'm going to file an action, Miles. And after a decent interval I plan to have Ruth seek an injunction that will forbid your approach within feet of my house."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_004", "type": "Event", "name": "Miles claims house ownership", "aliases": ["Miles claims house ownership"], "description": "Miles objects that Marylin is treating his house as hers, and Marylin replies that the residence will be part of the settlement.", "scene_refs": ["38"], "evidence": ["MARYLIN I believe the residence will be part of the settlement.", "MILES Meaning my house."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_005", "type": "Event", "name": "Miles questions their marriage", "aliases": ["Miles questions their marriage"], "description": "Miles asks whether their marriage ever meant anything to Marylin, exposing his hurt and insecurity.", "scene_refs": ["38"], "evidence": ["MILES Did our marriage ever mean anything to you?"]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_006", "type": "Event", "name": "Marylin offers blackmail bargain", "aliases": ["Marylin offers blackmail bargain"], "description": "Marylin tells Miles she will ignore his forgery charge if he drops it and stops pursuing her clients.", "scene_refs": ["38"], "evidence": ["MARYLIN Drop the bogus forgery charge and I'll forget about your generous friends slash clients."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_007", "type": "Event", "name": "Miles accuses Marylin of blackmail", "aliases": ["Miles accuses Marylin of blackmail"], "description": "Miles calls Marylin's offer blackmail, and she coolly reframes it as marriage.", "scene_refs": ["38"], "evidence": ["MARYLIN That's marriage.", "MILES That's blackmail."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_008", "type": "Event", "name": "Marylin leaves affectionately", "aliases": ["Marylin leaves affectionately"], "description": "Marylin kisses Miles on the cheek as she departs and calls him her favorite husband.", "scene_refs": ["38"], "evidence": ["She gives him a peck on the cheek. As she leaves: MARYLIN You'll always be my favorite husband."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_009", "type": "Event", "name": "Miles sinks into dejection", "aliases": ["Miles sinks into dejection"], "description": "After Marylin leaves, Miles sits alone on the new sofa and stares at the paintings, watch, cigars, and his mother's picture.", "scene_refs": ["38"], "evidence": ["Miles sits dejectedly on the new sofa looking at the paintings. He looks at the watch. And the cigars. And the picture of his mother."]}, {"id": "ev_en8dc9b5_38_doc_37_chunk_1_ev_010", "type": "Event", "name": "Miles mourns his absent mother", "aliases": ["Miles mourns his absent mother"], "description": "Miles speaks to his dead or absent mother, saying she would have enjoyed the situation.", "scene_refs": ["38"], "evidence": ["MILES Pity you can't be here. You'd enjoy this."]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_0_ev_001", "type": "Event", "name": "Miles watches Court TV in bed", "aliases": ["Miles watches Court TV in bed"], "description": "Miles lies in bed morosely watching Court TV, establishing his mood and idle state.", "scene_refs": ["39"], "evidence": ["Miles is in bed, morosely watching Court TV."]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_0_ev_002", "type": "Event", "name": "Court TV interrupts coverage with verdict news", "aliases": ["Court TV interrupts coverage with verdict news"], "description": "The broadcast interrupts weekend coverage to announce that a verdict has been reached in the Kentucky v Leonard case.", "scene_refs": ["39"], "evidence": ["'We are interrupting our scheduled weekend coverage because we have just received word there is a verdict in the Kentucky v Leonard Case. We now join the case -- live.'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_0_ev_003", "type": "Event", "name": "Jury acquits Leonard of murder", "aliases": ["Jury acquits Leonard of murder"], "description": "In the courtroom, the jury returns a not guilty verdict on the first-degree murder charge.", "scene_refs": ["39"], "evidence": ["'Of the charges of murder in the first degree, we the jury find the defendant -- not guilty.'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_0_ev_004", "type": "Event", "name": "Anchors comment on acquittal", "aliases": ["Anchors comment on acquittal"], "description": "Back in the studio, Nikki Rosen and her guest react to the acquittal as another example of a killer getting away with it.", "scene_refs": ["39"], "evidence": ["'Simpson started a trend.'", "Nikki turns to her guest host and says, 'He got away with it.'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_0_ev_005", "type": "Event", "name": "Scene cuts to gangster Joe", "aliases": ["Scene cuts to gangster Joe"], "description": "The scene shifts to a perspiring gangster named Joe, who appears edgy and physically strained.", "scene_refs": ["39"], "evidence": ["The scene cuts to a close-up of an edgy-looking gangster named Joe, perspiring heavily, breathing through his mouth with the rasping wheeze of an asthmatic."]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_0_ev_006", "type": "Event", "name": "Joe waits across the table", "aliases": ["Joe waits across the table"], "description": "Joe stares across the table at someone off-screen, suggesting a tense meeting already underway.", "scene_refs": ["39"], "evidence": ["His labored breath rattles as he stares across the table at someone off-screen."]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_0_ev_007", "type": "Event", "name": "Off-screen voice identifies Joe", "aliases": ["Off-screen voice identifies Joe"], "description": "A voice asks whether the man across the table is Joe, confirming the identity check in the meeting.", "scene_refs": ["39"], "evidence": ["A voice asks, 'Are you Joe?'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_0_ev_008", "type": "Event", "name": "Joe uses his inhaler", "aliases": ["Joe uses his inhaler"], "description": "Joe silently raises his inhaler, puts it in his mouth, and takes a puff to manage his breathing.", "scene_refs": ["39"], "evidence": ["Without looking away, the gangster raises an inhaler, places it in his mouth, and squeezes. WHUSH."]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_001", "type": "Event", "name": "Miles meets Joe at clam house", "aliases": ["Miles meets Joe at clam house"], "description": "Miles sits across from gangster Joe in a seedy clam house to conduct a clandestine business meeting.", "scene_refs": ["39"], "evidence": ["Miles seated across from Joe at a small round table in a seedy, low-lit clam house."]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_002", "type": "Event", "name": "Miles claims to represent Dumbarton", "aliases": ["Miles claims to represent Dumbarton"], "description": "Miles tells Joe he is representing Mr. Dumbarton on a delicate matter.", "scene_refs": ["39"], "evidence": ["Miles says, 'I am here representing Mr. Dumbarton, on a... matter of some delicacy.'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_003", "type": "Event", "name": "Joe asks who the target is", "aliases": ["Joe asks who the target is"], "description": "Joe immediately identifies the meeting as a murder-for-hire discussion and asks who Miles wants killed.", "scene_refs": ["39"], "evidence": ["Joe clarifies, 'Who do you want me to kill?'", "The gangster asks, 'Who's the pigeon?'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_004", "type": "Event", "name": "Miles names Marilyn as target", "aliases": ["Miles names Marilyn as target"], "description": "After stumbling over his words, Miles identifies Marylin Rexroth Doyle Massey as the person to be neutralized.", "scene_refs": ["39"], "evidence": ["Miles stammers, 'Well -- I, uh, that is to say Mr. Dumbarton -- would like you to uh, neutralize a, uh, business associate by the name of Marylin Rexroth Doyle Massey uh Dumbart -- uh, Massey.'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_005", "type": "Event", "name": "Joe confirms target identity", "aliases": ["Joe confirms target identity"], "description": "Joe checks whether Miles is referring to one person, underscoring the confusion around the target's name.", "scene_refs": ["39"], "evidence": ["Joe asks, 'Is that... one person?'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_006", "type": "Event", "name": "Miles provides target photo and address", "aliases": ["Miles provides target photo and address"], "description": "Miles slides Joe an envelope containing the target's picture and the address where she is staying.", "scene_refs": ["39"], "evidence": ["Miles pushes an envelope across the table: 'Here's her picture... and the address where she's staying.'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_007", "type": "Event", "name": "Miles sets expedited deadline", "aliases": ["Miles sets expedited deadline"], "description": "Miles explains that the killing must happen quickly because of an impending legal action.", "scene_refs": ["39"], "evidence": ["'And because of an impending legal action this needs to happen within a certain... time frame. Uh... on an expedited basis.'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_008", "type": "Event", "name": "Joe notes the rush", "aliases": ["Joe notes the rush"], "description": "Joe reacts to the deadline by observing that Miles is in a hurry.", "scene_refs": ["39"], "evidence": ["'You're in a rush,' he says."]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_009", "type": "Event", "name": "Miles confirms Dumbarton is rushing", "aliases": ["Miles confirms Dumbarton is rushing"], "description": "Miles admits that Mr. Dumbarton wants the job done quickly.", "scene_refs": ["39"], "evidence": ["'Mr. Dumbarton is, yes,' Miles replies."]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_010", "type": "Event", "name": "Miles demands painless death", "aliases": ["Miles demands painless death"], "description": "Miles anxiously asks whether the victim will suffer, revealing his fear and conscience.", "scene_refs": ["39"], "evidence": ["Miles explodes: 'She won't suffer, will she?'"]}, {"id": "ev_en8dc9b5_39_doc_38_chunk_1_ev_011", "type": "Event", "name": "Joe demands extra payment for painless death", "aliases": ["Joe demands extra payment for painless death"], "description": "Joe agrees that the killing can be painless only if Miles pays more.", "scene_refs": ["39"], "evidence": ["'...not unless you pay extra.'"]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_0_ev_001", "type": "Event", "name": "Miles lies passed out in guest room", "aliases": ["Miles lies passed out in guest room"], "description": "Miles is found asleep or passed out in a filthy guest room surrounded by empty wine bottles.", "scene_refs": ["41"], "evidence": ["A guest room. Dark, dirty and filled with empty bottles of expensive French wine.", "The figure on the bed stirs, rolls over, moans, clamps a pillow over his head."]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_0_ev_002", "type": "Event", "name": "Kenneth summons Miles to phone", "aliases": ["Kenneth summons Miles to phone"], "description": "Kenneth enters and tells Miles that a call is for him.", "scene_refs": ["41"], "evidence": ["KENNETH Miles. It's for you.", "Kenneth enters the background, knotting a bathrobe. He turns on the light in the room."]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_0_ev_003", "type": "Event", "name": "Miles answers urgent phone call", "aliases": ["Miles answers urgent phone call"], "description": "Miles takes the phone and reacts with shock to the news he is hearing.", "scene_refs": ["41"], "evidence": ["Miles blearily takes the offered phone.", "After another listening beat he drops the phone away.", "MILES Hello. Yes -- what?! Yes -- I see --"]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_0_ev_004", "type": "Event", "name": "Miles learns Rex has died", "aliases": ["Miles learns Rex has died"], "description": "Miles identifies the caller as Marvin Untermeyer and learns that Rex Rexroth has died of a massive coronary.", "scene_refs": ["41"], "evidence": ["MILES My God.", "MILES Rex just had a massive coronary. In the middle of a business meeting. He's dead.", "MILES He was Rex Rexroth's personal attorney.", "MILES That was Marvin Untermeyer."]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_0_ev_005", "type": "Event", "name": "Kenneth responds to Rex's death", "aliases": ["Kenneth responds to Rex's death"], "description": "Kenneth expresses mild sympathy but seems more puzzled than upset by the news.", "scene_refs": ["41"], "evidence": ["Kenneth is mildly puzzled.", "KENNETH I'm sorry to hear that. But you weren't close, were you?"]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_0_ev_006", "type": "Event", "name": "Miles realizes Marilyn inherits everything", "aliases": ["Miles realizes Marilyn inherits everything"], "description": "Miles explains that Rex never updated his will, so Marilyn inherits the estate and remains married to him without a prenup.", "scene_refs": ["41"], "evidence": ["MILES Everything goes to Marylin.", "MILES She's rich. We're still married. We have no pre-nup.", "MILES Marvin says that Rex's will is four years old. He never redrafted it."]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_0_ev_007", "type": "Event", "name": "Kenneth asks if inheritance is good", "aliases": ["Kenneth asks if inheritance is good"], "description": "Kenneth, still processing the news, asks whether Marilyn's inheritance is actually beneficial.", "scene_refs": ["41"], "evidence": ["KENNETH So, that's good, right?"]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_1_ev_001", "type": "Event", "name": "Miles frantically calls Joe", "aliases": ["Miles frantically calls Joe"], "description": "Miles paces with the telephone and urgently dials Joe while visibly shaken.", "scene_refs": ["41"], "evidence": ["He punches numbers with the thumb of the hand holding the phone; his other hand holds a coffee cup from which he takes trembling slurps.", "VOICE This is Joe. Wuddya need?", "Miles paces with the telephone.", "MILES Joe."]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_1_ev_002", "type": "Event", "name": "Miles orders Joe to abort the plan", "aliases": ["Miles orders Joe to abort the plan"], "description": "Miles identifies himself and tells Joe to stop whatever was planned regarding Marylin, insisting it is a no-go.", "scene_refs": ["41"], "evidence": ["Do you understand me?! NO GO on Marylin Rexroth Doyle -- No Go.", "MILES Joe. This is Mr. uh... friend of -- we met. This is to instruct you it's No Go!"]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_1_ev_003", "type": "Event", "name": "Miles hangs up abruptly", "aliases": ["Miles hangs up abruptly"], "description": "After issuing the warning, Miles slams down the phone in panic.", "scene_refs": ["41"], "evidence": ["He slams down the phone."]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_1_ev_004", "type": "Event", "name": "Kenneth questions the call", "aliases": ["Kenneth questions the call"], "description": "Kenneth asks who Miles was speaking to, prompting Miles's realization that the warning may have come too late.", "scene_refs": ["41"], "evidence": ["KENNETH Who was that?", "MILES That was -- oh, shit. What if he's on his way over there?"]}, {"id": "ev_en8dc9b5_41_doc_40_chunk_1_ev_005", "type": "Event", "name": "Miles realizes his mistake", "aliases": ["Miles realizes his mistake"], "description": "Miles becomes consumed with remorse and , "evidence": ["What would I tell little Gus when he asked \"what was my daddy like?\""], "confidence": 0.93}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

// Degree lookup from the rendered link set.
const degreeById = Object.fromEntries(nodes.map(n => [n.id, 0]));
for (const link of links) {
  if (degreeById[link.source] != null) degreeById[link.source] += 1;
  if (degreeById[link.target] != null) degreeById[link.target] += 1;
}

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#8fa4ff")
  .attr("stroke-width", d => {
    const rel = String(d.relation || "").toLowerCase();
    if (rel === "performs" || rel === "undergoes" || rel === "experiences") return 2.8;
    if (rel === "occurs_at" || rel === "located_at" || rel === "present_on") return 2.2;
    return 1.8;
  });

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => Math.max(7, Math.min(16, 6 + Math.sqrt((degreeById[d.id] || 0) + 1) * 3)))
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  h += `<br><i>Degree:</i> ${degreeById[d.id] || 0}`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
