<script>

 ["male voice sings Casey Jones song"], "description": "A male voice begins singing a song about Casey Jones over the cockpit speakers.", "scene_refs": ["13"], "evidence": ["MALE VOICE Oh Casey Jones was the rounder's name, T'was on the 6:02 that he rode to fame!"]}, {"id": "ent_en8dc9b5_13_doc_12_chunk_0_ent_001", "type": "Character", "name": "pilot", "aliases": ["pilot", "PILOT", "Pilot"], "description": "The uniformed pilot operating the corporate jet and reacting to the radio broadcast.", "scene_refs": ["13", "14"], "evidence": ["PILOT Jesus --", "PILOT Rex Rexroth, the mini-mall king.", "The pilot shrugs.", "He's thinking of buying Indiana.", "A uniformed pilot and copilot are cruising the corporate jet high above a vast ocean of clouds.", "The pilot reaches above his head and throws a small toggle switch"]}, {"id": "ent_en8dc9b5_13_doc_12_chunk_0_ent_002", "type": "Character", "name": "copilot", "aliases": ["copilot", "CO-PILOT"], "description": "The copilot seated beside the pilot, asking what he heard and hearing the new audio feed.", "scene_refs": ["13"], "evidence": ["CO-PILOT What?!", "CO-PILOT What --?", "A uniformed pilot and copilot are cruising the corporate jet high above a vast ocean of clouds."]}, {"id": "ent_en8dc9b5_13_doc_12_chunk_0_ent_005", "type": "Character", "name": "male voice", "aliases": ["male voice", "MALE VOICE"], "description": "An unidentified male voice heard over the cockpit speakers singing about Casey Jones.", "scene_refs": ["13"], "evidence": ["MALE VOICE Oh Casey Jones was the rounder's name, T'was on the 6:02 that he rode to fame!"]}, {"id": "ent_en8dc9b5_13_doc_12_chunk_0_ent_006", "type": "Character", "name": "Casey Jones", "aliases": ["Casey Jones"], "description": "The figure named in the song lyric broadcast into the cockpit.", "scene_refs": ["13"], "evidence": ["Oh Casey Jones was the rounder's name"]}, {"id": "ent_en8dc9b5_13_doc_12_chunk_0_ent_003", "type": "Object", "name": "headset", "aliases": ["headset"], "description": "The pilot's headset used while listening to the cockpit radio audio.", "scene_refs": ["13"], "evidence": ["The pilot is wearing a headset."]}, {"id": "ent_en8dc9b5_13_doc_12_chunk_0_ent_004", "type": "Object", "name": "toggle switch", "aliases": ["toggle switch"], "description": "The small switch the pilot flips to change the cockpit audio channel.", "scene_refs": ["13"], "evidence": ["The pilot reaches above his head and throws a small toggle switch"]}];
const links = [{"id": "e_ef06c5f6f7c0", "source": "ent_en8dc9b5_13_doc_12_chunk_0_ent_001", "relation": "performs", "target": "ev_en8dc9b5_13_doc_12_chunk_0_ev_001", "scene_refs": ["13"], "evidence": ["A uniformed pilot and copilot are cruising the corporate jet high above a vast ocean of clouds."], "confidence": 0.98}, {"id": "e_453bc2c444eb", "source": "ent_en8dc9b5_13_doc_12_chunk_0_ent_002", "relation": "performs", "target": "ev_en8dc9b5_13_doc_12_chunk_0_ev_001", "scene_refs": ["13"], "evidence": ["A uniformed pilot and copilot are cruising the corporate jet high above a vast ocean of clouds."], "confidence": 0.97}, {"id": "e_4851cfec58c1", "source": "ent_en8dc9b5_13_doc_12_chunk_0_ent_001", "relation": "experiences", "target": "ev_en8dc9b5_13_doc_12_chunk_0_ev_002", "scene_refs": ["13"], "evidence": ["The pilot is wearing a headset. After a long moment of listening he shakes his head."], "confidence": 0.96}, {"id": "e_9c7b46725c47", "source": "ent_en8dc9b5_13_doc_12_chunk_0_ent_002", "relation": "performs", "target": "ev_en8dc9b5_13_doc_12_chunk_0_ev_003", "scene_refs": ["13"], "evidence": ["CO-PILOT What --?"], "confidence": 0.99}, {"id": "e_61e4a1221fe3", "source": "ent_en8dc9b5_13_doc_12_chunk_0_ent_001", "relation": "performs", "target": "ev_en8dc9b5_13_doc_12_chunk_0_ev_004", "scene_refs": ["13"], "evidence": ["The pilot reaches above his head and throws a small toggle switch"], "confidence": 0.98}, {"id": "e_dbc28e28e07b", "source": "ent_en8dc9b5_13_doc_12_chunk_0_ent_001", "relation": "undergoes", "target": "ev_en8dc9b5_13_doc_12_chunk_0_ev_005", "scene_refs": ["13"], "evidence": ["the cockpit is Awash with the sound of screaming, laughter and music"], "confidence": 0.9}, {"id": "e_dc185889e3f9", "source": "ent_en8dc9b5_13_doc_12_chunk_0_ent_005", "relation": "performs", "target": "ev_en8dc9b5_13_doc_12_chunk_0_ev_006", "scene_refs": ["13"], "evidence": ["MALE VOICE Oh Casey Jones was the rounder's name, T'was on the 6:02 that he rode to fame!"], "confidence": 0.99}, {"id": "e_5ac40cc2429d", "source": "ent_en8dc9b5_13_doc_12_chunk_0_ent_004", "relation": "part_of", "target": "ent_en8dc9b5_13_doc_12_chunk_0_ent_003", "scene_refs": ["13"], "evidence": ["The pilot reaches above his head and throws a small toggle switch"], "confidence": 0.72}, {"id": "e_204ab3d2e83c", "source": "ev_en8dc9b5_13_doc_12_chunk_0_ev_006", "relation": "references", "target": "ev_en8dc9b5_13_doc_12_chunk_0_ev_005", "scene_refs": ["13"], "evidence": ["the cockpit is Awash with the sound of screaming, laughter and music: MALE VOICE Oh Casey Jones was the rounder's name"], "confidence": 0.73}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

// Degree lookup from the rendered link set.
const degreeById = Object.fromEntries(nodes.map(n => [n.id, 0]));
for (const link of links) {
  if (degreeById[link.source] != null) degreeById[link.source] += 1;
  if (degreeById[link.target] != null) degreeById[link.target] += 1;
}

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#8fa4ff")
  .attr("stroke-width", d => {
    const rel = String(d.relation || "").toLowerCase();
    if (rel === "performs" || rel === "undergoes" || rel === "experiences") return 2.8;
    if (rel === "occurs_at" || rel === "located_at" || rel === "present_on") return 2.2;
    return 1.8;
  });

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => Math.max(7, Math.min(16, 6 + Math.sqrt((degreeById[d.id] || 0) + 1) * 3)))
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  h += `<br><i>Degree:</i> ${degreeById[d.id] || 0}`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
</body>
