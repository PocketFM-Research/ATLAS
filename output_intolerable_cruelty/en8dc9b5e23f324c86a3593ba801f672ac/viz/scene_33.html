<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }

  .tooltip { position: absolute; background: rgba(20,20,40,0.95); border: 1px solid #555;
              border-radius: 6px; padding: 10px 14px; font-size: 13px; pointer-events: none;
              max-width: 360px; line-height: 1.4; display: none; z-index: 100; }
  .tooltip b { color: #fff; }
  .tooltip .type-badge { display: inline-block; padding: 1px 6px; border-radius: 3px;
                          font-size: 11px; margin-left: 6px; color: #fff; }
  #legend { position: fixed; top: 12px; right: 12px; background: rgba(20,20,40,0.9);
             border: 1px solid #444; border-radius: 8px; padding: 12px 16px; font-size: 13px; }
  #legend div { margin: 4px 0; }
  #legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
                  margin-right: 6px; vertical-align: middle; }
  #title-bar { position: fixed; top: 12px; left: 12px; font-size: 18px; font-weight: 600;

<script>

_refs": ["33"], "evidence": ["POLICE OFFICER Marylin Hamilton Rexroth Doyle Massey? MARYLIN Yes. POLICE OFFICER We have a warrant for your arrest."], "confidence": 0.95}, {"id": "e_015e9dc79cf1", "source": "ev_en8dc9b5_33_doc_32_chunk_0_ev_004", "relation": "precedes", "target": "ev_en8dc9b5_33_doc_32_chunk_0_ev_005", "scene_refs": ["33"], "evidence": ["POLICE OFFICER We have a warrant for your arrest. MARYLIN What?"], "confidence": 0.9}, {"id": "e_528360b7bc9a", "source": "ev_en8dc9b5_33_doc_32_chunk_0_ev_002", "relation": "occurs_after", "target": "ev_en8dc9b5_33_doc_32_chunk_0_ev_001", "scene_refs": ["33"], "evidence": ["Marylin walks to the door. Opens it. Two POLICE OFFICERS. MARYLIN Yes? Can I help you?"], "confidence": 0.95}, {"id": "e_cd2ff04afdfb", "source": "ev_en8dc9b5_33_doc_32_chunk_0_ev_003", "relation": "occurs_after", "target": "ev_en8dc9b5_33_doc_32_chunk_0_ev_002", "scene_refs": ["33"], "evidence": ["MARYLIN Yes? Can I help you? POLICE OFFICER Marylin Hamilton Rexroth Doyle Massey?"], "confidence": 0.95}, {"id": "e_b55645cc215a", "source": "ev_en8dc9b5_33_doc_32_chunk_0_ev_004", "relation": "occurs_after", "target": "ev_en8dc9b5_33_doc_32_chunk_0_ev_003", "scene_refs": ["33"], "evidence": ["POLICE OFFICER Marylin Hamilton Rexroth Doyle Massey? MARYLIN Yes. POLICE OFFICER We have a warrant for your arrest."], "confidence": 0.95}, {"id": "e_0ffd56acddd8", "source": "ev_en8dc9b5_33_doc_32_chunk_0_ev_005", "relation": "occurs_after", "target": "ev_en8dc9b5_33_doc_32_chunk_0_ev_004", "scene_refs": ["33"], "evidence": ["POLICE OFFICER We have a warrant for your arrest. MARYLIN What?"], "confidence": 0.9}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

// Degree lookup from the rendered link set.
const degreeById = Object.fromEntries(nodes.map(n => [n.id, 0]));
for (const link of links) {
  if (degreeById[link.source] != null) degreeById[link.source] += 1;
  if (degreeById[link.target] != null) degreeById[link.target] += 1;
}

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#8fa4ff")
  .attr("stroke-width", d => {
    const rel = String(d.relation || "").toLowerCase();
    if (rel === "performs" || rel === "undergoes" || rel === "experiences") return 2.8;
    if (rel === "occurs_at" || rel === "located_at" || rel === "present_on") return 2.2;
    return 1.8;
  });

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => Math.max(7, Math.min(16, 6 + Math.sqrt((degreeById[d.id] || 0) + 1) * 3)))
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  h += `<br><i>Degree:</i> ${degreeById[d.id] || 0}`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
</body>
