7", "23"], "evidence": ["Marylin enters the bedroom in a nightshirt that is the perfect combination of innocence and nastiness.", "We're married and we have no pre-nup", "Rex was married before me.", "buy married things", "MILES Well. You'd say ... your Dad.", "\"married couch\"", "MILES Did our marriage ever mean anything to you?", "What if something happened to you? What would I tell little Gus when he asked \"what was my daddy like?\"", "\"married house\"", "Miles and Marylin snuggle on a couch and watch Seinfeld.", "We're still married.", "MARYLIN You'll always be my favorite husband.", "MILES Nonono. Marylin -- I'm your husband.", "WOMAN You married Marylin, didn't you?", "MILES I want YOU to be MY wife.", "The Massey's have a candlelit dinner of fish and pasta."], "confidence": 0.99}, {"id": "e_40396e441e02", "source": "ent_en8dc9b5_44_doc_43_chunk_0_part_1_ent_001", "relation": "affinity_with", "target": "ent_en8dc9b5_9_doc_8_chunk_0_ent_003", "scene_refs": ["44"], "evidence": ["MARYLIN It's okay Joe.", "(To Joe) I'm sorry."], "confidence": 0.84}, {"id": "e_c0770658ad2b", "source": "ev_en8dc9b5_44_doc_43_chunk_1_ev_002", "relation": "occurs_after", "target": "ev_en8dc9b5_44_doc_43_chunk_1_ev_001", "scene_refs": ["44"], "evidence": ["Joe is raising the gun at Miles. Miles sprays him with Mace."], "confidence": 0.95}, {"id": "e_aa9ca68af4a0", "source": "ev_en8dc9b5_44_doc_43_chunk_1_ev_003", "relation": "occurs_after", "target": "ev_en8dc9b5_44_doc_43_chunk_1_ev_002", "scene_refs": ["44"], "evidence": ["Miles sprays him with Mace. BANG -- Joe fires blindly"], "confidence": 0.95}, {"id": "e_30587bcc47d5", "source": "ev_en8dc9b5_44_doc_43_chunk_1_ev_004", "relation": "occurs_after", "target": "ev_en8dc9b5_44_doc_43_chunk_1_ev_003", "scene_refs": ["44"], "evidence": ["BANG -- Joe fires blindly, scrunching his eyes against the chemical, sucking for breath like a jet engine revving for a take-off. SLAM -- Marylin elbows him in the face, breaking his nose."], "confidence": 0.9}, {"id": "e_ad0c92eb9472", "source": "ev_en8dc9b5_44_doc_43_chunk_1_ev_005", "relation": "occurs_after", "target": "ev_en8dc9b5_44_doc_43_chunk_1_ev_004", "scene_refs": ["44"], "evidence": ["Marylin elbows him in the face, breaking his nose. She finishes with a solid groin kick."], "confidence": 0.98}, {"id": "e_9661f9e2728d", "source": "ev_en8dc9b5_44_doc_43_chunk_1_ev_006", "relation": "occurs_after", "target": "ev_en8dc9b5_44_doc_43_chunk_1_ev_005", "scene_refs": ["44"], "evidence": ["She finishes with a solid groin kick. It slows him down, but doesn't stop him. Joe stumbles a bit, but regains his footing. BANG -- Joe is rampaging around the room, still firing"], "confidence": 0.96}, {"id": "e_60a442201193", "source": "ev_en8dc9b5_44_doc_43_chunk_1_ev_007", "relation": "occurs_after", "target": "ev_en8dc9b5_44_doc_43_chunk_1_ev_006", "scene_refs": ["44"], "evidence": ["Joe is rampaging around the room, still firing, thumping at his chest with his free hand for his inhaler."], "confidence": 0.95}, {"id": "e_8bfd70f25715", "source": "ev_en8dc9b5_44_doc_43_chunk_1_ev_009", "relation": "occurs_after", "target": "ev_en8dc9b5_44_doc_43_chunk_1_ev_008", "scene_refs": ["44"], "evidence": ["Marylin runs to Miles. He takes her hand and they run toward the door, seeking egress."], "confidence": 0.96}, {"id": "e_5deaa411a4f2", "source": "ev_en8dc9b5_44_doc_43_chunk_1_ev_010", "relation": "occurs_after", "target": "ev_en8dc9b5_44_doc_43_chunk_1_ev_009", "scene_refs": ["44"], "evidence": ["BANG -- still firing, he pulls out the inhaler but blindly bobbles it."], "confidence": 0.7}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

// Degree lookup from the rendered link set.
const degreeById = Object.fromEntries(nodes.map(n => [n.id, 0]));
for (const link of links) {
  if (degreeById[link.source] != null) degreeById[link.source] += 1;
  if (degreeById[link.target] != null) degreeById[link.target] += 1;
}

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#8fa4ff")
  .attr("stroke-width", d => {
    const rel = String(d.relation || "").toLowerCase();
    if (rel === "performs" || rel === "undergoes" || rel === "experiences") return 2.8;
    if (rel === "occurs_at" || rel === "located_at" || rel === "present_on") return 2.2;
    return 1.8;
  });

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => Math.max(7, Math.min(16, 6 + Math.sqrt((degreeById[d.id] || 0) + 1) * 3)))
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  h += `<br><i>Degree:</i> ${degreeById[d.id] || 0}`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
