d": "e_c247f6c6b4da", "source": "ev_en8dc9b5_45_doc_44_chunk_1_ev_010", "relation": "occurs_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["INT. MASSEY MYERSON CONFERENCE ROOM - DAY", "MILES Let's go home."], "confidence": 0.98}, {"id": "e_b281c0c7fe81", "source": "ent_en8dc9b5_21_doc_20_chunk_0_part_1_ent_011", "relation": "uses", "target": "ent_en8dc9b5_21_doc_20_chunk_0_part_1_ent_010", "scene_refs": ["45"], "evidence": ["there's nothing in the Massey pre-nup that says it can't be executed after the parties wed.", "He decisively clicks the button on a ballpoint pen"], "confidence": 0.72}, {"id": "e_459c25383810", "source": "ent_en8dc9b5_45_doc_44_chunk_1_ent_007", "relation": "is_a", "target": "ent_en8dc9b5_2_doc_1_chunk_0_part_0_ent_011", "scene_refs": ["45"], "evidence": ["I'll buy you a drink"], "confidence": 0.55}, {"id": "e_16c4113ce5a1", "source": "ent_en8dc9b5_45_doc_44_chunk_1_ent_008", "relation": "is_a", "target": "ent_en8dc9b5_2_doc_1_chunk_0_part_0_ent_011", "scene_refs": ["45"], "evidence": ["an anti depressant"], "confidence": 0.52}, {"id": "e_bd3958d3b36e", "source": "ent_en8dc9b5_21_doc_20_chunk_0_part_1_ent_010", "relation": "is_a", "target": "ent_en8dc9b5_2_doc_1_chunk_0_part_0_ent_011", "scene_refs": ["45"], "evidence": ["the Massey pre-nup"], "confidence": 0.88}, {"id": "e_1dc499b7439b", "source": "ent_en8dc9b5_3_doc_2_chunk_0_part_0_ent_005", "relation": "located_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["INT. MASSEY MYERSON CONFERENCE ROOM - DAY"], "confidence": 0.99}, {"id": "e_048751266f48", "source": "ent_en8dc9b5_3_doc_2_chunk_1_ent_004", "relation": "located_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["INT. MASSEY MYERSON CONFERENCE ROOM - DAY"], "confidence": 0.99}, {"id": "e_9f1d4a83832b", "source": "ent_en8dc9b5_1_doc_0_chunk_0_ent_004", "relation": "located_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["INT. MASSEY MYERSON CONFERENCE ROOM - DAY"], "confidence": 0.99}, {"id": "e_0ebc584c379e", "source": "ent_en8dc9b5_9_doc_8_chunk_0_ent_003", "relation": "located_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["INT. MASSEY MYERSON CONFERENCE ROOM - DAY"], "confidence": 0.99}, {"id": "e_e179d6aa1175", "source": "ent_en8dc9b5_21_doc_20_chunk_0_part_1_ent_010", "relation": "located_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["the paper in front of him", "across the table"], "confidence": 0.9}, {"id": "e_c5a62dab2826", "source": "ent_en8dc9b5_21_doc_20_chunk_0_part_1_ent_011", "relation": "located_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["a ballpoint pen"], "confidence": 0.9}, {"id": "e_6982fd8aeef0", "source": "ent_en8dc9b5_45_doc_44_chunk_1_ent_007", "relation": "located_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["I'll buy you a drink"], "confidence": 0.7}, {"id": "e_049999b5d85d", "source": "ent_en8dc9b5_45_doc_44_chunk_1_ent_008", "relation": "located_at", "target": "ent_en8dc9b5_45_doc_44_chunk_1_ent_009", "scene_refs": ["45"], "evidence": ["I'll buy you a drink and an anti depressant"], "confidence": 0.7}, {"id": "e_af09253d7079", "source": "ent_en8dc9b5_9_doc_8_chunk_0_ent_003", "relation": "hostility_with", "target": "ent_en8dc9b5_1_doc_0_chunk_0_ent_004", "scene_refs": ["45"], "evidence": ["MILES But then -- I guess -- something inside me died when I realized that you'd hired a goon to kill me.", "MARYLIN Yes. I know. It's exactly how I felt when I realized you'd hired the goon to kill..."], "confidence": 0.93}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

// Degree lookup from the rendered link set.
const degreeById = Object.fromEntries(nodes.map(n => [n.id, 0]));
for (const link of links) {
  if (degreeById[link.source] != null) degreeById[link.source] += 1;
  if (degreeById[link.target] != null) degreeById[link.target] += 1;
}

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#8fa4ff")
  .attr("stroke-width", d => {
    const rel = String(d.relation || "").toLowerCase();
    if (rel === "performs" || rel === "undergoes" || rel === "experiences") return 2.8;
    if (rel === "occurs_at" || rel === "located_at" || rel === "present_on") return 2.2;
    return 1.8;
  });

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => Math.max(7, Math.min(16, 6 + Math.sqrt((degreeById[d.id] || 0) + 1) * 3)))
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  h += `<br><i>Degree:</i> ${degreeById[d.id] || 0}`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
