<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intolerable Cruelty — Scene 46</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
  .link { stroke-opacity: 0.9; }
  .link:hover { stroke-opacity: 1; }
  .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
  .node text { font-size: 11px; fill: #ccc; pointer-events: none; }
  .tooltip { position: absolute; background: rgba(20,20,40,0.95); border: 1px solid #555;
              border-radius: 6px; padding: 10px 14px; font-size: 13px; pointer-events: none;
              max-width: 360px; line-height: 1.4; display: none; z-index: 100; }
  .tooltip b { color: #fff; }
  .tooltip .type-badge { display: inline-block; padding: 1px 6px; border-radius: 3px;
                          font-size: 11px; margin-left: 6px; color: #fff; }
  #legend { position: fixed; top: 12px; right: 12px; background: rgba(20,20,40,0.9);
             border: 1px solid #444; border-radius: 8px; padding: 12px 16px; font-size: 13px; }
  #legend div { margin: 4px 0; }
  #legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
                  margin-right: 6px; vertical-align: middle; }
  #title-bar { position: fixed; top: 12px; left: 12px; font-size: 18px; font-weight: 600;
                background: rgba(20,20,40,0.9); border: 1px solid #444; border-radius: 8px;
                padding: 8px 16px; }
</style>
</head>
<body>
<div id="title-bar">Intolerable Cruelty — Scene 46</div>
<div id="legend"></div>
<div class="tooltip" id="tooltip"></div>
<svg></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const nodes = [{"id": "ev_en8dc9b5_46_doc_45_chunk_0_ev_001", "type": "Event", "name": "smashing sound erupts", "aliases": ["smashing sound erupts"], "description": "A smashing, breaking noise is heard offscreen, interrupting the quiet yard work.", "scene_refs": ["46"], "evidence": ["We hear a SMASHING -- BREAKING."]}, {"id": "ev_en8dc9b5_46_doc_45_chunk_0_ev_002", "type": "Event", "name": "gardeners briefly react", "aliases": ["gardeners briefly react"], "description": "The gardeners look up briefly in response to the noise.", "scene_refs": ["46"], "evidence": ["Gardeners look up briefly from the leaf blowing"]}, {"id": "ev_en8dc9b5_46_doc_45_chunk_0_ev_003", "type": "Event", "name": "gardeners keep working", "aliases": ["gardeners keep working"], "description": "After a momentary reaction, the gardeners continue blowing leaves across the yard.", "scene_refs": ["46"], "evidence": ["but quickly prioritize and continue blasting sycamore leaves from one end of the yard to the other."]}, {"id": "ev_en8dc9b5_46_doc_45_chunk_0_ev_004", "type": "Event", "name": "camera tracks through house", "aliases": ["camera tracks through house"], "description": "The scene transitions by tracking through the house, moving the action indoors.", "scene_refs": ["46"], "evidence": ["TRACK THROUGH HOUSE TO"]}, {"id": "ent_en8dc9b5_46_doc_45_chunk_0_ent_001", "type": "Character", "name": "Gardeners", "aliases": ["Gardeners"], "description": "The yard workers who briefly react to the smashing noise and then continue leaf blowing.", "scene_refs": ["46"], "evidence": ["continue blasting sycamore leaves", "Gardeners look up briefly from the leaf blowing"]}, {"id": "ent_en8dc9b5_46_doc_45_chunk_0_ent_004", "type": "Location", "name": "Yard", "aliases": ["Yard", "yard"], "description": "The outdoor area where the gardeners are working.", "scene_refs": ["46"], "evidence": ["from one end of the yard to the other"]}, {"id": "ent_en8dc9b5_46_doc_45_chunk_0_ent_005", "type": "Location", "name": "House", "aliases": ["House", "house"], "description": "The interior space the camera tracks through as the scene transitions indoors.", "scene_refs": ["46"], "evidence": ["TRACK THROUGH HOUSE TO"]}, {"id": "ent_en8dc9b5_46_doc_45_chunk_0_ent_002", "type": "Object", "name": "Leaf blower", "aliases": ["Leaf blower", "leaf blower", "leaf blowing"], "description": "The yard equipment the gardeners are using while working in the yard.", "scene_refs": ["46"], "evidence": ["continue blasting sycamore leaves", "from the leaf blowing"]}, {"id": "ent_en8dc9b5_46_doc_45_chunk_0_ent_003", "type": "Object", "name": "Sycamore leaves", "aliases": ["Sycamore leaves", "sycamore leaves"], "description": "The leaves being blown across the yard by the gardeners.", "scene_refs": ["46"], "evidence": ["continue blasting sycamore leaves from one end of the yard to the other"]}];
const links = [{"id": "e_eb599996faef", "source": "ent_en8dc9b5_46_doc_45_chunk_0_ent_001", "relation": "performs", "target": "ev_en8dc9b5_46_doc_45_chunk_0_ev_002", "scene_refs": ["46"], "evidence": ["Gardeners look up briefly from the leaf blowing"], "confidence": 0.93}, {"id": "e_27f04189c1a8", "source": "ent_en8dc9b5_46_doc_45_chunk_0_ent_001", "relation": "performs", "target": "ev_en8dc9b5_46_doc_45_chunk_0_ev_003", "scene_refs": ["46"], "evidence": ["quickly prioritize and continue blasting sycamore leaves from one end of the yard to the other"], "confidence": 0.97}, {"id": "e_fcca19515ec8", "source": "ent_en8dc9b5_46_doc_45_chunk_0_ent_001", "relation": "located_at", "target": "ent_en8dc9b5_46_doc_45_chunk_0_ent_004", "scene_refs": ["46"], "evidence": ["from one end of the yard to the other"], "confidence": 0.98}, {"id": "e_b11f595969bd", "source": "ent_en8dc9b5_46_doc_45_chunk_0_ent_002", "relation": "uses", "target": "ent_en8dc9b5_46_doc_45_chunk_0_ent_003", "scene_refs": ["46"], "evidence": ["leaf blowing -- ... continue blasting sycamore leaves"], "confidence": 0.84}, {"id": "e_3cbe51fcff52", "source": "ent_en8dc9b5_46_doc_45_chunk_0_ent_002", "relation": "located_at", "target": "ent_en8dc9b5_46_doc_45_chunk_0_ent_004", "scene_refs": ["46"], "evidence": ["from one end of the yard to the other"], "confidence": 0.7}, {"id": "e_20c3d5e81d93", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_001", "relation": "occurs_at", "target": "ent_en8dc9b5_46_doc_45_chunk_0_ent_005", "scene_refs": ["46"], "evidence": ["TRACK THROUGH HOUSE TO"], "confidence": 0.55}, {"id": "e_4e322bb3a553", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_002", "relation": "occurs_at", "target": "ent_en8dc9b5_46_doc_45_chunk_0_ent_004", "scene_refs": ["46"], "evidence": ["Gardeners look up briefly from the leaf blowing"], "confidence": 0.86}, {"id": "e_bc1f8e27b743", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_003", "relation": "occurs_at", "target": "ent_en8dc9b5_46_doc_45_chunk_0_ent_004", "scene_refs": ["46"], "evidence": ["from one end of the yard to the other"], "confidence": 0.98}, {"id": "e_0e97c60479d3", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_004", "relation": "occurs_at", "target": "ent_en8dc9b5_46_doc_45_chunk_0_ent_005", "scene_refs": ["46"], "evidence": ["TRACK THROUGH HOUSE TO"], "confidence": 0.9}, {"id": "e_87ff1811ed62", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_001", "relation": "precedes", "target": "ev_en8dc9b5_46_doc_45_chunk_0_ev_002", "scene_refs": ["46"], "evidence": ["We hear a SMASHING -- BREAKING. Gardeners look up briefly"], "confidence": 0.74}, {"id": "e_42b2bdceb684", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_002", "relation": "precedes", "target": "ev_en8dc9b5_46_doc_45_chunk_0_ev_003", "scene_refs": ["46"], "evidence": ["look up briefly ... but quickly prioritize and continue blasting"], "confidence": 0.95}, {"id": "e_2e7095acea15", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_004", "relation": "references", "target": "ev_en8dc9b5_46_doc_45_chunk_0_ev_001", "scene_refs": ["46"], "evidence": ["TRACK THROUGH HOUSE TO"], "confidence": 0.52}, {"id": "e_80abcfdb8936", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_002", "relation": "occurs_after", "target": "ev_en8dc9b5_46_doc_45_chunk_0_ev_001", "scene_refs": ["46"], "evidence": ["We hear a SMASHING -- BREAKING. Gardeners look up briefly"], "confidence": 0.74}, {"id": "e_2759ed72812b", "source": "ev_en8dc9b5_46_doc_45_chunk_0_ev_003", "relation": "occurs_after", "target": "ev_en8dc9b5_46_doc_45_chunk_0_ev_002", "scene_refs": ["46"], "evidence": ["look up briefly ... but quickly prioritize and continue blasting"], "confidence": 0.95}];
const typeColors = {"Character": "#4A90D9", "Event": "#6ABF69", "Location": "#E8943A", "Vehicle": "#9B59B6", "Object": "#95A5A6", "TimePoint": "#E74C3C", "Concept": "#F1C40F"};
const defaultColor = "#CCCCCC";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  legend.append("div").html(`<span style="background:${typeColors[t]||defaultColor}"></span>${t} (${nodes.filter(n=>n.type===t).length})`);
});

// Degree lookup from the rendered link set.
const degreeById = Object.fromEntries(nodes.map(n => [n.id, 0]));
for (const link of links) {
  if (degreeById[link.source] != null) degreeById[link.source] += 1;
  if (degreeById[link.target] != null) degreeById[link.target] += 1;
}

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);

// Zoom
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

// Build id lookup
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

// Links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#8fa4ff")
  .attr("stroke-width", d => {
    const rel = String(d.relation || "").toLowerCase();
    if (rel === "performs" || rel === "undergoes" || rel === "experiences") return 2.8;
    if (rel === "occurs_at" || rel === "located_at" || rel === "present_on") return 2.2;
    return 1.8;
  });

// Link labels
const linkLabel = g.append("g")
  .selectAll("text")
  .data(links)
  .join("text")
  .attr("font-size", 9)
  .attr("fill", "#888")
  .attr("text-anchor", "middle")
  .text(d => d.relation);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => Math.max(7, Math.min(16, 6 + Math.sqrt((degreeById[d.id] || 0) + 1) * 3)))
  .attr("fill", d => typeColors[d.type] || defaultColor);

node.append("text")
  .attr("dx", 14)
  .attr("dy", 4)
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + "..." : d.name);

// Tooltip
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  const color = typeColors[d.type] || defaultColor;
  let h = `<b>${d.name}</b><span class="type-badge" style="background:${color}">${d.type}</span><br>`;
  h += `<br><i>Degree:</i> ${degreeById[d.id] || 0}`;
  if (d.description) h += `<br>${d.description}`;
  if (d.aliases && d.aliases.length > 1) h += `<br><i>Aliases:</i> ${d.aliases.join(", ")}`;
  if (d.scene_refs && d.scene_refs.length) h += `<br><i>Scenes:</i> ${d.scene_refs.join(", ")}`;
  tooltip.html(h).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

link.on("mouseover", (e, d) => {
  const src = typeof d.source === "object" ? d.source.name : d.source;
  const tgt = typeof d.target === "object" ? d.target.name : d.target;
  tooltip.html(`<b>${src}</b> &rarr; <i>${d.relation}</i> &rarr; <b>${tgt}</b>`).style("display", "block");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY - 14) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabel.attr("x", d => (d.source.x + d.target.x) / 2)
           .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
</body>
</html>
